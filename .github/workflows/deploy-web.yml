name: Validate SeaMart Online Store
on:
  push:
    branches: [seamart-web-odoo]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check storefront file
        run: test -s web/toko.html
