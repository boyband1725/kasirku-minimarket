name: Siapkan Foto SeaMart Batch 04
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/siapkan-foto-batch-04.yml'
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan lingkungan
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests
      - name: Unduh dan validasi foto berdasarkan barcode
        run: |
          mkdir -p photos
          cat > prepare.py <<'PY'
          import io, os, requests
          from PIL import Image
          items = [
              ("8886008101336.jpg", "https://www.yoline.co.id/media/products/ProductAqua_330ml.png", "AQUA 330 ML"),
          ]
          ok, failed = [], []
          for filename, url, name in items:
              try:
                  r = requests.get(url, timeout=40, headers={"User-Agent":"Mozilla/5.0 SeaMartCatalog/1.0"})
                  r.raise_for_status()
                  im = Image.open(io.BytesIO(r.content)).convert("RGB")
                  if im.width < 350 or im.height < 350:
                      raise ValueError(f"resolusi terlalu kecil: {im.size}")
                  im.thumbnail((900, 900), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGB", (900, 900), "white")
                  canvas.paste(im, ((900-im.width)//2, (900-im.height)//2))
                  canvas.save(os.path.join("photos", filename), "JPEG", quality=93, optimize=True)
                  ok.append((filename, name, im.size))
                  print("OK", filename, name, im.size)
              except Exception as e:
                  failed.append((filename, name, str(e)))
                  print("FAILED", filename, name, e)
          with open("photos/DAFTAR-FOTO.txt", "w", encoding="utf-8") as f:
              f.write("SeaMart Batch 04 - foto produk tervalidasi\n")
              for filename, name, size in ok:
                  f.write(f"OK | {filename} | {name} | {size}\n")
              for filename, name, err in failed:
                  f.write(f"GAGAL | {filename} | {name} | {err}\n")
          if failed:
              raise SystemExit(f"{len(failed)} foto gagal diunduh.")
          PY
          python prepare.py
          cd photos && zip -9 -r ../SeaMart-Foto-Batch-04.zip .
      - name: Unggah ZIP sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaMart-Foto-Batch-04
          path: SeaMart-Foto-Batch-04.zip
          if-no-files-found: error
          retention-days: 14
