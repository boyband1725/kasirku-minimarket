name: Siapkan Foto Produk SeaMart
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/siapkan-foto-produk.yml"
jobs:
  build-photo-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Unduh foto AQUA 600 ml
        run: |
          set -euo pipefail
          mkdir -p photo-zip
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0" \
            "https://down-id.img.susercontent.com/file/sg-11134201-8262x-mjy1hynpo5qacb" \
            --output photo-zip/8886008101053.jpg
          file photo-zip/8886008101053.jpg
          test -s photo-zip/8886008101053.jpg
      - name: Validasi format dan resolusi
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path("photo-zip/8886008101053.jpg")
          if p.stat().st_size < 5000:
              raise SystemExit("Foto terlalu kecil")
          with Image.open(p) as im:
              im.verify()
          with Image.open(p) as im:
              if im.format not in ("JPEG", "PNG", "WEBP"):
                  raise SystemExit(f"Format tidak didukung: {im.format}")
              if im.width < 350 or im.height < 350:
                  raise SystemExit(f"Resolusi terlalu kecil: {im.size}")
              print(f"VALID: {im.format} {im.width}x{im.height}, {p.stat().st_size} bytes")
          PY
      - name: Simpan foto barcode sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaMart-Foto-AQUA-600ml
          path: photo-zip/8886008101053.jpg
          if-no-files-found: error
          retention-days: 14
