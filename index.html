/* Odoo-inspired POS workspace */
.odoo-pos-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.odoo-pos-head h1{margin:0 0 4px;font-size:25px}
.odoo-pos-tools{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.odoo-pos-tools .search{min-width:160px}
.odoo-pos-layout{display:grid;grid-template-columns:178px minmax(0,1fr) 350px;gap:14px;align-items:start}
.odoo-category-panel,.odoo-catalog-panel,.odoo-order-panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.odoo-category-panel{padding:12px;position:sticky;top:82px}
.odoo-panel-label{font-size:10px;font-weight:800;letter-spacing:1px;color:#89929c;padding:5px 8px 10px}
.odoo-cat{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:transparent;color:#47525d;padding:10px 9px;margin:2px 0;border-radius:8px;font-weight:600}
.odoo-cat:hover{background:#f3f7f5}.odoo-cat.active{background:var(--green2);color:var(--green)}
.odoo-cat-icon{width:25px;height:25px;display:grid;place-items:center;background:#f0f3f2;border-radius:7px;font-size:14px}
.odoo-cat.active .odoo-cat-icon{background:#d4eddf}
.odoo-catalog-panel{padding:15px;min-height:480px}
.odoo-catalog-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.odoo-catalog-top h3{margin:0;font-size:15px}.odoo-count{font-size:11px;color:var(--muted);background:#f4f6f7;padding:5px 8px;border-radius:20px}
.odoo-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px}
.odoo-product{position:relative;border:1px solid #e9edef;border-radius:10px;padding:9px;background:#fff;text-align:left;min-width:0;transition:.15s}
.odoo-product:hover{border-color:#69b18e;box-shadow:0 5px 15px #16845b12;transform:translateY(-1px)}
.odoo-product-image{height:104px;background:#f4f6f5;border-radius:7px;display:grid;place-items:center;overflow:hidden;font-size:34px;margin-bottom:9px}
.odoo-product-image img{width:100%;height:100%;object-fit:cover}
.odoo-product-name{font-size:12px;line-height:1.4;font-weight:700;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.odoo-product-meta{font-size:10px;color:#8a949d;margin-top:5px}
.odoo-product-price{font-size:13px;font-weight:800;color:var(--green);margin-top:7px}
.odoo-order-panel{position:sticky;top:82px;padding:0;overflow:hidden}
.odoo-order-head{padding:16px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.odoo-order-head h3{margin:0;font-size:15px}
.odoo-order-body{padding:13px 16px}
.odoo-order-lines{min-height:145px;max-height:36vh;overflow:auto}
.odoo-order-lines .empty{padding:38px 10px}
.odoo-order-panel .cartline{align-items:center}
.odoo-order-panel .grand{font-size:21px}
.odoo-pay-label{font-size:11px;color:var(--muted);font-weight:700}
.odoo-checkout{font-size:14px;padding:13px}
.odoo-scan-hint{font-size:11px;color:#87919a;margin-top:10px;text-align:center}

/* SeaMart POS reference design */
:root{--green:#087b43;--green2:#d9f8e2;--nav:#064d35;--line:#e2eee7;--shadow:0 5px 18px rgba(8,90,53,.08)}
.sidebar{background:linear-gradient(180deg,#005b3d 0%,#06452f 100%);color:#e9fff1}
.brand{padding-bottom:25px}
.nav{color:#d7f3e2;border-radius:12px;padding:13px 14px}
.nav:hover{background:#087b43;color:#fff}
.nav.active{background:linear-gradient(135deg,#16bd53,#078b3c);color:#fff;box-shadow:0 5px 14px #002e1d55}

body{background:#f3f7fc!important;color:#172b45!important}
.sidebar{background:#073b78!important;color:#e8f2ff!important}
.sidebar .navitem.active,.sidebar .navitem:hover{background:#145ba5!important;color:#fff!important}

async function fetchAllStoreProducts(sb,store){
 const all=[],pageSize=500;
 for(let from=0;from<10000;from+=pageSize){
  let result=null,lastError=null;
  for(let attempt=1;attempt<=3;attempt++){
   try{
    result=await sb.from('products').select('id,code,barcode,name,category_id,price,price_2,price_3,purchase_price,purchase_vat_rate,sales_vat_rate,margin_1,margin_2,margin_3,sale_base_1,sale_base_2,sale_base_3,stock,active,image_url').eq('store_id',store).range(from,from+pageSize-1);
    if(result.error)throw result.error;
    lastError=null;break;
   }catch(error){
    lastError=error;
    if(attempt<3)await new Promise(resolve=>setTimeout(resolve,700*attempt));
   }
  }
  if(lastError){
   const message=String(lastError.message||lastError);
   if(/failed to fetch|network|load failed|fetch failed/i.test(message)){
    throw new Error('Tidak dapat terhubung ke Supabase untuk mengambil master barang. Periksa internet/akses Supabase, lalu tekan Refresh lagi. Data lokal tidak dihapus.');
   }
   throw lastError;
  }
  const pageRows=result?.data||[];all.push(...pageRows);
  if(pageRows.length<pageSize)break;
 }
 return {data:all,error:null};
}

}
function applySeaMartCloudStock(rows){
 let changed=0,photosChanged=0;
 for(const row of (rows||[])){
  let p=db.products.find(x=>String(x.id||'')===String(row.id||''));
  if(!p&&row.code){
   const matches=db.products.filter(x=>String(x.kode||'').trim()===String(row.code).trim());
   if(matches.length===1)p=matches[0];
  }
  if(!p&&row.barcode){
   const matches=db.products.filter(x=>String(x.barcode||'').trim()===String(row.barcode).trim());
   if(matches.length===1)p=matches[0];
  }
  if(p&&Number(p.stok)!==Number(row.stock)){p.stok=Number(row.stock||0);changed++;}
  if(p&&row.image_url&&String(p.foto||'')!==String(row.image_url)){p.foto=String(row.image_url);p.image_url=String(row.image_url);photosChanged++;}
 }
 if(changed||photosChanged){
  save();
  if(document.getElementById('ptable')&&typeof filterProducts==='function')filterProducts();
  if(typeof renderPosProducts==='function'&&document.getElementById('posproducts'))renderPosProducts();
  if(typeof renderCart==='function'&&document.getElementById('cartItems'))renderCart();
  document.dispatchEvent(new CustomEvent('seamart:stock-updated',{detail:{changed,photosChanged}}));

 }
 return changed+photosChanged;
}

async function syncOneProduct(p,categoryCache=new Map()){

   const path=store+'/'+p.id+'.jpg';
   const upload=await sb.storage.from('seamart-product-photos').upload(path,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'3600'});
   if(upload.error)throw new Error('Upload foto gagal: '+upload.error.message+' (jalankan SQL pengaturan foto SeaMart terlebih dahulu).');

   p.foto=imageUrl;p.image_url=imageUrl;
  }else imageUrl=String(p.foto);
  p.image_url=imageUrl;
 }
 const row={id:p.id,store_id:store,code:(normalizeProductIdentifier(p.kode)||null),barcode:(normalizeProductIdentifier(p.barcode)||null),name:p.nama,category_id:categoryId,price:Number(p.harga_jual_1??p.harga??0),price_2:Number(p.harga_jual_2||0),price_3:Number(p.harga_jual_3||0),purchase_price:Number(p.harga_beli||0),purchase_vat_rate:Number(p.ppn_beli??11),sales_vat_rate:Number(p.ppn_jual??11),margin_1:Number(p.margin_1??50),margin_2:Number(p.margin_2??50),margin_3:Number(p.margin_3??50),sale_base_1:Number(p.harga_jual_1_sebelum_ppn||0),sale_base_2:Number(p.harga_jual_2_sebelum_ppn||0),sale_base_3:Number(p.harga_jual_3_sebelum_ppn||0),stock:Math.max(0,Number(p.stok||0)),active:p.active!==false,image_url:imageUrl};

 if(existing){

  const result=await sb.from('products').update({code:row.code,barcode:row.barcode,name:row.name,category_id:row.category_id,price:row.price,price_2:row.price_2,price_3:row.price_3,stock:row.stock,active:row.active,image_url:row.image_url,purchase_price:row.purchase_price,purchase_vat_rate:row.purchase_vat_rate,sales_vat_rate:row.sales_vat_rate,margin_1:row.margin_1,margin_2:row.margin_2,margin_3:row.margin_3,sale_base_1:row.sale_base_1,sale_base_2:row.sale_base_2,sale_base_3:row.sale_base_3}).eq('id',existing.id).eq('store_id',store).select('id,price,price_2,price_3').maybeSingle();
  if(result.error)throw result.error;
  if(!result.data)throw new Error('Cloud tidak mengonfirmasi perubahan barang. Periksa izin UPDATE/RLS tabel products; data lokal tidak dianggap tersinkron.');
  if(Number(result.data.price)!==row.price)throw new Error('Verifikasi cloud gagal: Harga Jual 1 yang tersimpan ('+Number(result.data.price||0)+') berbeda dari nilai yang dikirim ('+row.price+'). Perubahan tidak dianggap tersinkron.');if(Number(result.data.price_2)!==row.price_2||Number(result.data.price_3)!==row.price_3)throw new Error('Verifikasi cloud gagal: Harga Jual 2/3 yang tersimpan tidak sama dengan nilai yang dikirim.');

async function syncAllProducts(existingRows=[]){
 let correctedNegativeStock=0;
 for(const product of db.products){if(Number(product.stok)<0){product.stok=0;correctedNegativeStock++;}}
 if(correctedNegativeStock)save();
 const norm=v=>String(v??'').trim();
 const key=v=>norm(v).toLocaleLowerCase('id-ID');
 const seenIds=new Set(existingRows.map(r=>norm(r.id)).filter(Boolean));
 const remoteByCode=new Map();
 for(const r of existingRows){const code=norm(r.code);if(code&&!remoteByCode.has(code))remoteByCode.set(code,r);}
 const candidates=[];
 const summary={added:0,skipped:0,failed:0,errors:[]};
 for(let i=0;i<db.products.length;i++){
  const p=db.products[i],id=norm(p.id),code=norm(p.kode);
  if(id&&seenIds.has(id)){summary.skipped++;continue;}
  const sameCode=code?remoteByCode.get(code):null;
  if(sameCode){
   if(key(sameCode.name)===key(p.nama)){summary.skipped++;continue;}
   summary.failed++;
   if(summary.errors.length<10)summary.errors.push((p.nama||code||('Baris '+(i+1)))+': kode barang '+code+' sudah dipakai oleh '+(sameCode.name||'barang lain')+' di cloud; perlu pemeriksaan manual.');
   continue;
  }
  candidates.push({p,index:i});
 }
 const total=candidates.length;
 updateSeaMartSyncProgress(db.products.length?summary.skipped/db.products.length*100:100,'Memulai: '+summary.skipped+' dari '+db.products.length+' produk sudah ada di cloud',{total,added:0,skipped:summary.skipped,failed:0});
 if(!total){updateSeaMartSyncProgress(100,'Semua produk sudah ada di cloud',{total:0,added:0,skipped:summary.skipped,failed:0,finished:true});return summary;}
 const categoryCache=new Map();
 let completed=0;
 for(let i=0;i<candidates.length;i+=20){
  const batch=candidates.slice(i,i+20);
  const results=await Promise.allSettled(batch.map(async item=>{
   let lastError;
   for(let attempt=0;attempt<3;attempt++){
    try{await syncOneProduct(item.p,categoryCache);return;}
    catch(e){lastError=e;if(attempt<2)await new Promise(resolve=>setTimeout(resolve,400*(attempt+1)));}
   }
   throw lastError;
  }));
  results.forEach((result,j)=>{
   const item=batch[j];
   if(result.status==='fulfilled')summary.added++;
   else{summary.failed++;if(summary.errors.length<10)summary.errors.push((item.p.nama||item.p.kode||('Baris '+(item.index+1)))+': '+(result.reason?.message||String(result.reason)));}
  });
  completed+=batch.length;save();
  const successful=summary.skipped+summary.added;const successRate=db.products.length?successful/db.products.length*100:100;
  updateSeaMartSyncProgress(successRate,'Berhasil '+successful+' dari '+db.products.length+' produk lokal',{total,added:summary.added,skipped:summary.skipped,failed:summary.failed});
 }
 const finalSuccessful=summary.skipped+summary.added;const finalRate=db.products.length?finalSuccessful/db.products.length*100:100;
 updateSeaMartSyncProgress(finalRate,'Berhasil '+finalSuccessful+' dari '+db.products.length+' produk lokal',{total,added:summary.added,skipped:summary.skipped,failed:summary.failed,finished:true});
 if(summary.failed)console.warn('Produk gagal disinkronkan:',summary.errors);
 return summary;
}

  if(window.confirm(message))page('dashboard');

 }
 if(e.key==='F4'){e.preventDefault();if(!modal)checkout();return;}
 if(modal)return;
 // Numpad fisik PC: dukung NumLock aktif/nonaktif dan kode keyCode lama.
 {
  const code=e.code||'',key=e.key||'',kc=e.keyCode||e.which||0;
  const digitMatch=code.match(/^Numpad([0-9])$/);
  const digit=digitMatch?digitMatch[1]:(kc>=96&&kc<=105?String(kc-96):null);
  const plus=code==='NumpadAdd'||kc===107||key==='+'||key==='Add';
  const minus=code==='NumpadSubtract'||kc===109||key==='-'||key==='Subtract';
  const del=key==='Delete'||code==='NumpadDecimal'||kc===46;
  const back=key==='Backspace'||kc===8;
  const enter=key==='Enter'||code==='NumpadEnter'||kc===13;
  const selectedId=window.selectedCartId;
  const selected=cart.find(x=>String(x.id)===String(selectedId));
  const focus=document.activeElement;
  const typingInOtherField=focus&&focus!==document.body&&focus!==document.getElementById('cartKeyboardDisplay')&&focus!==document.getElementById('cartQtyDisplay')&&
   (focus.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(focus.tagName));
  if(!modal&&!typingInOtherField){
   if(plus||minus){
    e.preventDefault();e.stopPropagation();
    if(!selected){alert('Klik/pilih barang di keranjang terlebih dahulu.');return;}
    changeQty(selected.id,plus?1:-1);return;
   }
   if(del){

    if(!selected){alert('Klik/pilih barang di keranjang terlebih dahulu.');return;}
    removeCartItem(selected.id);renderPosProducts();return;
   }
   if(window.cartKeyMode==='qty'){
    if(digit!==null){e.preventDefault();e.stopPropagation();cartKey(digit);return;}
    if(back){e.preventDefault();e.stopPropagation();cartKey('back');return;}
    if(enter){e.preventDefault();e.stopImmediatePropagation();e.stopPropagation();applyCartKeyboard();return;}
    if(code==='NumpadDecimal'||kc===110){e.preventDefault();e.stopPropagation();cartKey('clear');return;}
   }
  }
 }
 if(e.key==='F2'){
  e.preventDefault();
  const selectedId=window.selectedCartId;
  if(selectedId===undefined||selectedId===null||!cart.some(x=>String(x.id)===String(selectedId))){
   alert('Pilih satu baris barang di keranjang terlebih dahulu, lalu tekan F2.');

 }
 if(e.key==='F3'){e.preventDefault();document.getElementById('posbarcode')?.focus();return}

 if(e.key==='F9'){e.preventDefault();if(cart.length&&window.confirm('Lanjutkan proses pembayaran sekarang?'))checkout();return}

 if(e.key==='Delete'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();if(cart.length&&window.confirm('Kosongkan semua barang di keranjang?')){cart=[];renderCart()}return}

function knownCatalogProductPhoto(p){
 const barcode=String(p.barcode||'').trim().replace(/\.0$/,'').replace(/\D/g,'');
 if(!barcode)return '';
 const match=PRODUCT_PHOTO_MANIFEST.find(item=>String(item[0]).replace(/\D/g,'')===barcode);
 return match?match[2]:'';
}

function productPicture(p){
 const sharedPhoto=p.foto||p.image_url||knownCatalogProductPhoto(p);
 if(sharedPhoto)return '<img src="'+esc(sharedPhoto)+'" alt="Foto kemasan '+esc(p.nama||'produk')+'" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:contain;border-radius:8px;background:#fff">';
 const cigarettePhoto=knownCigarettePhoto(p);
 if(cigarettePhoto)return '<img src="'+cigarettePhoto+'" alt="Foto kemasan '+esc(p.nama||'produk')+'" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:contain;border-radius:8px;background:#fff">';
 return categoryIcon(p);
}
/* Auto-load verified product photos for featured POS items when a real barcode is available. */
window.seamartPosPhotoLookups=window.seamartPosPhotoLookups||new Set();
async function hydrateFeaturedProductPhotos(items){
 for(const p of items){
  const barcode=String(p.barcode||'').trim(),key=barcode;
  // Never attach an image by a loose product-name search: similar variants can have different packaging or size.
  if(p.foto||!/^\d{8,14}$/.test(key)||window.seamartPosPhotoLookups.has(key))continue;
  window.seamartPosPhotoLookups.add(key);
  try{
   const response=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(barcode)+'.json?fields=code,product_name,selected_images');
   if(!response.ok)continue;
   const data=await response.json(),product=data.status===1?data.product:null;
   if(!product||String(product.code||'').trim()!==barcode||!product.product_name||!product.selected_images?.front)continue;
   const front=product.selected_images.front,images=front.display||front.small||front;
   const url=typeof images==='string'?images:(images&&typeof images==='object'?(images.en||Object.values(images)[0]||''):'');
   if(!url)continue;
   await validateProductPhoto(url,p.nama,product.product_name);
   p.foto=url;save();
   const tile=[...document.querySelectorAll('[data-product-photo]')].find(el=>el.dataset.productPhoto===String(p.id));
   if(tile)tile.innerHTML=productPicture(p);
  }catch(err){console.info('Foto tidak dipasang karena barcode/varian belum terverifikasi: '+p.nama,err)}
 }
}
async function loadNovemberMasterRows(){
 const response=await fetch('./SeaMart_Master_Barang_November_2026_Siap_Impor.csv',{cache:'no-store'});
 if(!response.ok)throw new Error('File master resmi 138 barang tidak dapat dimuat (HTTP '+response.status+').');
 const rows=parseCSV((await response.text()).replace(/^\uFEFF/,''));
 if(rows.length<2)throw new Error('File master resmi kosong.');
 const head=rows.shift().map(x=>x.trim().toLowerCase()),col=n=>head.indexOf(n);
 const required=['kode_barang','nama_barang','barcode','harga_beli','harga_jual_1','harga_jual_2','harga_jual_3','stok','kelompok_barang'];
 const missing=required.filter(n=>col(n)<0);if(missing.length)throw new Error('Kolom master resmi kurang: '+missing.join(', '));
 const number=v=>{const n=Number(String(v??'').trim().replace(/,/g,''));return Number.isFinite(n)?n:0;};
 const source=rows.filter(r=>String(r[col('kode_barang')]??'').trim()).map(r=>({
  kode:normalizeProductIdentifier(r[col('kode_barang')]),nama:String(r[col('nama_barang')]??'').trim(),
  barcode:normalizeProductIdentifier(r[col('barcode')]),harga_beli:number(r[col('harga_beli')]),
  harga_jual_1:number(r[col('harga_jual_1')]),harga_jual_2:number(r[col('harga_jual_2')]),
  harga_jual_3:number(r[col('harga_jual_3')]),harga:number(r[col('harga_jual_1')]),
  stok:number(r[col('stok')]),kategori:String(r[col('kelompok_barang')]??'').trim()||'Umum'
 }));
 if(source.length!==138)throw new Error('Master resmi berisi '+source.length+' barang, bukan 138. Master tidak diterapkan.');
 if(new Set(source.map(p=>p.kode)).size!==138)throw new Error('Kode barang master resmi tidak unik. Master tidak diterapkan.');
 return source;
}
function mergeNovemberMaster(source,current,remote){
 const local=Array.isArray(current)?current:[],cloud=Array.isArray(remote)?remote:[];
 const norm=s=>String(s??'').trim();
 const normCode=s=>norm(s).replace(/^0+(?=\d)/,'');
 const normName=s=>norm(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
 let preservedPhotos=0;
 const merged=source.map(p=>{
  let cloudHits=cloud.filter(x=>norm(x.code)===p.kode);
  if(cloudHits.length!==1)cloudHits=cloud.filter(x=>p.barcode&&norm(x.barcode)===p.barcode);
  if(cloudHits.length!==1)cloudHits=cloud.filter(x=>normCode(x.code)===normCode(p.kode));
  const row=cloudHits.length===1?cloudHits[0]:null;
  let localHits=local.filter(x=>norm(x.kode)===p.kode);
  if(localHits.length!==1)localHits=local.filter(x=>normCode(x.kode)===normCode(p.kode));
  if(localHits.length!==1&&p.barcode)localHits=local.filter(x=>norm(x.barcode)===p.barcode);
  if(localHits.length!==1)localHits=local.filter(x=>normName(x.nama)===normName(p.nama));
  const old=localHits.length===1?localHits[0]:null;
  const photo=row?.image_url||row?.foto||old?.foto||old?.image_url||'';
  if(photo)preservedPhotos++;
  return {...p,id:row?.id||old?.id||('nov2026-'+p.kode),
   stok:row?Number(row.stock??p.stok):(old?Number(old.stok??p.stok):p.stok),
   active:old?.active!==false,foto:photo,
   image_url:row?.image_url||old?.image_url||old?.foto||''
  };
 });
 merged._photoPreservedCount=preservedPhotos;
 return merged;
}

  const number=v=>{const n=Number(String(v??'').trim().replace(/,/g,''));return Number.isFinite(n)?n:0;};
  const source=rows.filter(r=>String(r[col('kode_barang')]??'').trim()).map(r=>({
   kode:normalizeProductIdentifier(r[col('kode_barang')]),
   nama:String(r[col('nama_barang')]??'').trim(),

   harga_jual_1:number(r[col('harga_jual_1')]),
   harga_jual_2:number(r[col('harga_jual_2')]),
   harga_jual_3:number(r[col('harga_jual_3')]),
   harga:number(r[col('harga_jual_1')]),
   stok:number(r[col('stok')]),
   kategori:String(r[col('kelompok_barang')]??'').trim()||'Umum'
  }));
  if(source.length!==138)throw new Error('Jumlah data master terbaca '+source.length+', seharusnya 138. Data tidak diubah.');
  if(new Set(source.map(p=>p.kode)).size!==138)throw new Error('Ada kode barang ganda pada file master. Data tidak diubah.');
  const current=Array.isArray(db.products)?db.products:[];
  const next=mergeNovemberMaster(source,current,[]);
  const preservedPhotoCount=next._photoPreservedCount||0;
  delete next._photoPreservedCount;
  if(!confirm('Terapkan master November 2026 sebanyak 138 barang? Master barang perangkat ini akan diganti. Backup seluruh data akan diunduh dahulu. Riwayat transaksi dan data lain tetap dipertahankan.'))return;
  download('seamart-backup-sebelum-master-november.json',JSON.stringify(db,null,2));
  db.products=next;save();localStorage.setItem('seamart_master_source_v1','local');
  products();
  alert('Berhasil! Master November 138 barang sudah diterapkan. '+preservedPhotoCount+' foto produk berhasil dipertahankan berdasarkan kode, barcode, atau nama produk yang cocok. Kode Odoo dan nol di depan dipertahankan. Backup JSON telah diunduh. Data lain tetap disimpan.');
 }catch(error){alert('Master November gagal diterapkan: '+(error?.message||error)+'. Tidak ada perubahan master.');}
 finally{if(button){button.disabled=false;button.textContent='Terapkan Master Barang Baru';}}
}

async function validateProductPhoto(url,targetName,sourceName){
 const normalize=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9. ]/g,' ').replace(/\s+/g,' ').trim();
 const tokens=s=>normalize(s).split(' ').filter(x=>x.length>=3&&!['produk','barang','pack','pcs','piece','gram','gr'].includes(x));
 const wanted=tokens(targetName),found=tokens(sourceName),shared=wanted.filter(x=>found.includes(x));
 if(!wanted.length||!shared.length)throw new Error('Nama produk tidak cocok dengan data foto. Foto ditolak.');
 const variants=s=>{
  const n=normalize(s),out=[];
  const re=/(\d+(?:\.\d+)?)\s*(ml|milliliter|l|liter|gr|g|kg|kilogram)\b/g;let m;
  while((m=re.exec(n))!==null){let unit=m[2];if(unit==='milliliter')unit='ml';if(unit==='liter')unit='l';if(unit==='kilogram')unit='kg';if(unit==='gr')unit='g';out.push(Number(m[1])+' '+unit);}
  if(/\b(galon|gal\.?|dispenser)\b/.test(n))out.push('kemasan-galon');
  if(/\b(botol|btl)\b/.test(n))out.push('kemasan-botol');
  if(/\b(kaleng|can)\b/.test(n))out.push('kemasan-kaleng');
  if(/\b(sachet|saset)\b/.test(n))out.push('kemasan-sachet');
  return [...new Set(out)];
 };
 const wantedVariants=variants(targetName),foundVariants=variants(sourceName);
 const wantedSizes=wantedVariants.filter(v=>/^\d/.test(v)),foundSizes=foundVariants.filter(v=>/^\d/.test(v));
 const wantedPacks=wantedVariants.filter(v=>v.startsWith('kemasan-')),foundPacks=foundVariants.filter(v=>v.startsWith('kemasan-'));
 // Compare size only when both names state a size, and packaging only when both state a package type.
 // A catalogue title saying "bottle" alone must not invalidate a target named "Aqua 330 ml".
 const sizeMismatch=wantedSizes.length&&foundSizes.length&&!wantedSizes.some(v=>foundSizes.includes(v));
 const packMismatch=wantedPacks.length&&foundPacks.length&&!wantedPacks.some(v=>foundPacks.includes(v));
 if(sizeMismatch||packMismatch){
  throw new Error('Ukuran/kemasan foto berbeda. Barang: '+(wantedVariants.join(', ')||'tidak disebutkan')+'. Data katalog: '+(foundVariants.join(', ')||'tidak disebutkan')+'. Foto ditolak agar tidak salah produk.');
 }
 const img=new Image();

 const ratio=img.naturalWidth/img.naturalHeight;
 if(ratio<0.3||ratio>2.5)throw new Error('Proporsi gambar tidak layak untuk foto produk.');

}

async function fetchPhotoSourceWithRetry(url,options={},attempts=3){
 let lastError;
 for(let attempt=1;attempt<=attempts;attempt++){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
   const response=await fetch(url,{...options,signal:controller.signal});
   clearTimeout(timer);
   if(response.ok)return response;
   lastError=new Error('Server katalog HTTP '+response.status);
   if(response.status<500||attempt===attempts)throw lastError;
  }catch(error){clearTimeout(timer);lastError=error;if(/^Server katalog HTTP 4(?!29)\d{2}$/.test(error.message||'')||attempt===attempts)break;}
  await new Promise(resolve=>setTimeout(resolve,700*attempt));
 }
 throw new Error(lastError?.name==='AbortError'?'Koneksi katalog timeout setelah 15 detik':(lastError?.message||'Katalog foto tidak merespons'));
}

function removeCartItem(id){const item=cart.find(x=>x.id===id);if(!item)return;cart=cart.filter(x=>x.id!==id);renderCart();}
function changeQty(id,d){let x=cart.find(x=>String(x.id)===String(id));if(!x)return;const p=db.products.find(y=>String(y.id)===String(id)),stock=Math.max(0,Number(p?.stok||0));if(d>0&&x.qty>=stock)return alert('Jumlah melebihi stok tersedia: '+stock);x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>String(x.id)!==String(id));renderCart();renderPosProducts()}
function cancelOrder(){if(!cart.length)return alert('Tidak ada pesanan yang perlu dibatalkan.');if(!confirm('Batalkan transaksi ini? Semua barang di keranjang akan dihapus.'))return;cart=[];renderCart();}
function updateCashChange(){const input=document.getElementById('posCashReceived'),change=document.getElementById('posCashChange'),total=cart.reduce((a,x)=>a+(db.products.find(p=>p.id===x.id)?.harga||0)*x.qty,0),paid=Number(input?.value||0);if(change)change.textContent=rupiah(Math.max(0,paid-total));const display=document.getElementById('cartKeyboardDisplay');if(display&&(window.cartKeyMode||'cash')==='cash')display.value=input?.value||'0';}

function selectPaymentMethod(method){
 window.smSelectedPayment=method;
 const paySelect=document.getElementById('paymethod');if(paySelect)paySelect.value=method;
 document.getElementById('chooseCash').classList.toggle('active',method==='Tunai');
 document.getElementById('chooseQris').classList.toggle('active',method==='QRIS');
 const cashInput=document.getElementById('smCashReceived');if(cashInput)cashInput.disabled=method!=='Tunai';
 const cashFields=document.getElementById('smCashFields');
 if(cashFields){cashFields.hidden=method!=='Tunai';cashFields.style.setProperty('display',method==='Tunai'?'block':'none','important');}

let smPaymentDragState=null;
function startPaymentModalDrag(event){
 const handle=event.currentTarget;
 const dialog=handle?.closest('.sm-payment-modal');
 if(!dialog||!event.isPrimary||(event.pointerType==='mouse'&&event.button!==0))return;
 if(event.target instanceof Element&&event.target.closest('button,input,select,textarea,a,[role="button"]'))return;
 event.preventDefault();
 const rect=dialog.getBoundingClientRect();
 const pointerId=event.pointerId;
 dialog.style.setProperty('position','fixed','important');
 dialog.style.setProperty('margin','0','important');
 dialog.style.setProperty('left',rect.left+'px','important');
 dialog.style.setProperty('top',rect.top+'px','important');
 dialog.style.setProperty('right','auto','important');
 dialog.style.setProperty('bottom','auto','important');
 dialog.style.setProperty('transform','none','important');
 dialog.classList.add('sm-payment-dragging');
 smPaymentDragState={dialog,handle,pointerId,startX:event.clientX,startY:event.clientY,left:rect.left,top:rect.top,moved:false};
 try{handle.setPointerCapture(pointerId)}catch(_){}
 document.addEventListener('pointermove',movePaymentModalDrag,{capture:true,passive:false});
 document.addEventListener('pointerup',endPaymentModalDrag,true);
 document.addEventListener('pointercancel',endPaymentModalDrag,true);
}
function movePaymentModalDrag(event){
 const d=smPaymentDragState;
 if(!d||event.pointerId!==d.pointerId)return;
 event.preventDefault();
 const dx=event.clientX-d.startX,dy=event.clientY-d.startY;
 if(Math.abs(dx)+Math.abs(dy)>2)d.moved=true;
 const viewport=window.visualViewport;
 const width=viewport?.width||window.innerWidth;
 const height=viewport?.height||window.innerHeight;
 const offsetLeft=viewport?.offsetLeft||0;
 const offsetTop=viewport?.offsetTop||0;
 const maxLeft=Math.max(offsetLeft,width+offsetLeft-d.dialog.offsetWidth);
 const maxTop=Math.max(offsetTop,height+offsetTop-d.dialog.offsetHeight);
 const left=Math.min(maxLeft,Math.max(offsetLeft,d.left+dx));
 const top=Math.min(maxTop,Math.max(offsetTop,d.top+dy));
 d.dialog.style.setProperty('left',left+'px','important');
 d.dialog.style.setProperty('top',top+'px','important');
}
function endPaymentModalDrag(event){
 const d=smPaymentDragState;
 if(!d)return;
 if(event?.pointerId!==undefined&&event.pointerId!==d.pointerId)return;
 d.dialog.classList.remove('sm-payment-dragging');
 try{if(d.handle.hasPointerCapture(d.pointerId))d.handle.releasePointerCapture(d.pointerId)}catch(_){}
 if(d.moved)window.smPaymentDraggedAt=Date.now();
 smPaymentDragState=null;
 document.removeEventListener('pointermove',movePaymentModalDrag,true);
 document.removeEventListener('pointerup',endPaymentModalDrag,true);
 document.removeEventListener('pointercancel',endPaymentModalDrag,true);
}
function paymentModalKey(key){const input=document.getElementById('smCashReceived');if(!input||input.disabled||input.readOnly)return;let value=String(input.value||'0');if(key==='back')value=value.slice(0,-1)||'0';else if(key==='clear')value='0';else if(key==='enter'){input.focus();updatePaymentModalChange();return;}else value=(value==='0'?key:value+key).slice(0,14);input.value=value;updatePaymentModalChange();}

// Keyboard fisik PC: aktif hanya ketika overlay pembayaran sedang terbuka.
document.addEventListener('keydown',function(event){
 const modal=document.querySelector('#modalroot .sm-payment-modal');
 if(!modal)return;
 const input=modal.querySelector('#smCashReceived');
 if(!input||input.disabled||window.smSelectedPayment==='QRIS')return;
 const code=event.code||'';
 let key=null;
 if(/^Numpad[0-9]$/.test(code))key=code.slice(-1);
 else if(code==='NumpadEnter')key='enter';
 else if(code==='Backspace')key='back';
 else if(code==='Delete')key='clear';
 if(key===null)return;
 event.preventDefault();
 event.stopPropagation();
 paymentModalKey(key);
},true);
function updatePaymentModalChange(){
 const total=cart.reduce((n,x)=>n+(db.products.find(p=>p.id===x.id)?.harga||0)*x.qty,0);
 const paid=Number(document.getElementById('smCashReceived')?.value||0);
 document.getElementById('smCashChange').textContent=rupiah(Math.max(0,paid-total));

function confirmPayment(){
 const pay=window.smSelectedPayment||'Tunai';
 const total=cart.reduce((n,x)=>n+(db.products.find(p=>p.id===x.id)?.harga||0)*x.qty,0);
 const paid=pay==='Tunai'?Number(document.getElementById('smCashReceived')?.value||document.getElementById('posCashReceived')?.value||0):total;
 if(pay==='Tunai'&&paid<total)return alert('Uang diterima belum cukup. Masukkan nominal uang dari pelanggan.');
 completeCheckout(pay,paid);
}
async function completeCheckout(pay,paid){
 if(!requireOpenShift()||!cart.length)return;
 for(const x of cart){const p=db.products.find(p=>p.id===x.id);if(!p)return alert('Barang tidak ditemukan.');if(Number(p.stok||0)<Number(x.qty||0))return alert('Stok '+p.nama+' tidak cukup. Tersedia: '+Number(p.stok||0));}
 const items=cart.map(x=>{const p=db.products.find(p=>p.id===x.id);return {nama:p.nama,qty:x.qty,harga:p.harga,subtotal:p.harga*x.qty,product_id:p.id}});
 const total=items.reduce((n,x)=>n+x.subtotal,0),change=paid-total,id='SM-'+Date.now().toString().slice(-8);
 if(paid<total)return alert('Pembayaran kurang.');
 const sb=window.seamartSupabase,store=window.seamartStoreId;
 let cloudSaved=false;
 if(sb&&store){
  if(!items.every(x=>isUuid(x.product_id)))return alert('ID barang belum tersinkron ke cloud. Sinkronkan master barang dahulu, lalu ulangi transaksi.');
  const cloud=await sb.rpc('seamart_complete_pos_sale',{
   p_store_id:store,
   p_sale_code:id,
   p_cashier_name:currentUser?.nama||'',
   p_shift_ref:String(currentShift()?.id||''),
   p_payment_method:pay,
   p_amount_paid:paid,
   p_items:items.map(x=>({product_id:x.product_id,quantity:x.qty}))
  });
  if(cloud.error)return alert('Transaksi cloud gagal: '+(cloud.error.message||cloud.error)+'\nKeranjang tidak dihapus dan stok lokal tidak diubah.');
  cloudSaved=true;
 }
 const stamp=new Date().toISOString();
 cart.forEach(x=>{const p=db.products.find(p=>p.id===x.id);p.stok-=x.qty;db.moves.push({id:'M'+Date.now()+Math.random(),time:dateNow(),at:stamp,produk:p.nama,jenis:'Keluar / Terjual',qty:x.qty,delta:-x.qty,keterangan:id});});
 db.sales.push({id,time:dateNow(),at:stamp,cashier:currentUser?.nama||'',shiftId:currentShift()?.id||'',total,pay,paid,change,items:items.map(({product_id,...x})=>x),cloudSynced:cloudSaved});
 db.cashflows=db.cashflows||[];
 const saleCash={id:crypto.randomUUID(),at:stamp,date:stamp.slice(0,10),type:'Masuk',category:'Penjualan '+pay,note:'Transaksi '+id,amount:total,source:'sale',source_ref:id,synced:cloudSaved};
 db.cashflows.push(saleCash);save();
 if(!cloudSaved&&window.seamartCashFlowSyncReady)syncCashFlowEntry(saleCash).catch(e=>alert('Transaksi lokal tersimpan, tetapi arus kas belum tersinkron: '+(e.message||e)));
 cart=[];
 // Reset uang diterima and its cashier keypad display after a successful sale.
 const cashInput=document.getElementById('posCashReceived');if(cashInput)cashInput.value='0';
 const cashDisplay=document.getElementById('cartKeyboardDisplay');if(cashDisplay)cashDisplay.value='0';
 const cashChange=document.getElementById('posCashChange');if(cashChange)cashChange.textContent='0';
 const modalCash=document.getElementById('smCashReceived');if(modalCash)modalCash.value='0';
 const modalChange=document.getElementById('smCashChange');if(modalChange)modalChange.textContent='0';
 window.cartKeyboardValue='';window.cartKeyMode='cash';
 document.getElementById('modalroot').innerHTML=`<div class="modalback"><div class="modal"><h2>Transaksi berhasil</h2><p class="muted">${id} · ${dateNow()}</p>${items.map(x=>`<div class="totalrow"><span>${esc(x.nama)} × ${x.qty}</span><b>${rupiah(x.subtotal)}</b></div>`).join('')}<div class="totalrow grand"><span>Total</span><span>${rupiah(total)}</span></div><p class="muted">Metode: ${esc(pay)} · ${cloudSaved?'Tersinkron ke cloud':'Mode lokal'}</p>${pay==='Tunai'?'<div class="totalrow"><span>Uang diterima</span><b>'+rupiah(paid)+'</b></div><div class="totalrow"><span>Kembalian</span><b>'+rupiah(change)+'</b></div>':''}<div class="actions"><button class="btn-light" onclick="closeModal()">Tutup</button><button class="btn-primary" onclick="printReceipt('${id}')">Cetak Struk</button></div></div></div>`;
 renderCart();
}

 if(!ports.length)return false;

 seamartWindowsSerialPort=port;

}

function stock(){const now=new Date(),today=now.toISOString().slice(0,10),monthStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10),oldStart=document.getElementById('stock_start')?.value,oldEnd=document.getElementById('stock_end')?.value,oldSearch=document.getElementById('stock_search')?.value||'';document.getElementById('view').innerHTML=`<div class="pagehead"><div><h1>Posisi & Mutasi Stok Barang</h1><div class="sub">Rincian stok awal, tambahan dari pemasok/cabang, barang keluar atau terjual, dan stok akhir.</div></div><div class="toolbar"><button class="btn-light" onclick="exportStockReport()">⇩ Ekspor CSV</button><button class="btn-primary" onclick="printStockReport()">Cetak PDF</button><button class="btn-light" onclick="moveModal()">＋ Catat Mutasi</button></div></div><div class="panel"><div class="toolbar"><label class="muted">Periode awal <input id="stock_start" type="date" class="field" value="${oldStart||monthStart}" onchange="stock()"></label><label class="muted">Periode akhir <input id="stock_end" type="date" class="field" value="${oldEnd||today}" onchange="stock()"></label><input id="stock_search" class="field search" placeholder="Cari nama, kode, barcode, kelompok..." value="${esc(oldSearch)}" oninput="stock()"></div><div class="emptyhint">Nilai persediaan dihitung memakai harga beli/modal; bila belum diisi, harga jual dipakai sebagai perkiraan.</div></div><div id="stock_report"></div><div class="panel"><h3>Riwayat Mutasi Terbaru</h3>${db.moves.length?'<div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Barang</th><th>Jenis</th><th>Qty</th><th>Keterangan</th></tr></thead><tbody>'+db.moves.slice().reverse().slice(0,100).map(m=>`<tr><td>${esc(m.time||'-')}</td><td>${esc(m.produk||'-')}</td><td>${esc(m.jenis||'-')}</td><td>${Number(m.qty||0)}</td><td>${esc(m.keterangan||'-')}</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">Belum ada mutasi stok.</div>'}</div>`;renderStockReport()}
function getStockRows(){const start=document.getElementById('stock_start')?.value||'1900-01-01',end=document.getElementById('stock_end')?.value||new Date().toISOString().slice(0,10),q=(document.getElementById('stock_search')?.value||'').toLowerCase(),sd=new Date(start+'T00:00:00'),ed=new Date(end+'T23:59:59.999');return db.products.filter(p=>[p.nama,p.kode,p.barcode,p.kategori].join(' ').toLowerCase().includes(q)).map(p=>{const all=db.moves.filter(m=>m.produk===p.nama),deltas=all.map(m=>({date:moveDate(m),delta:movementDelta(m)})).filter(x=>x.date),after=deltas.filter(x=>x.date>=sd).reduce((a,x)=>a+x.delta,0),period=deltas.filter(x=>x.date>=sd&&x.date<=ed),incoming=period.filter(x=>x.delta>0).reduce((a,x)=>a+x.delta,0),outgoing=-period.filter(x=>x.delta<0).reduce((a,x)=>a+x.delta,0),opening=Number(p.stok||0)-after,ending=opening+incoming-outgoing,cost=Number(p.harga_beli||0)||Number(p.harga||0);return {...p,opening,incoming,outgoing,ending,cost,openingValue:opening*cost,incomingValue:incoming*cost,outgoingValue:outgoing*cost,endingValue:ending*cost}})}
function renderStockReport(){const rows=getStockRows(),sum=k=>rows.reduce((a,p)=>a+Number(p[k]||0),0),groups={};rows.forEach(p=>(groups[p.kategori||'Umum']??=[]).push(p));const body=Object.entries(groups).map(([cat,items])=>'<tr><td colspan="12" style="background:#f4f7f5;font-weight:800;color:#3d6653">'+esc(cat)+'</td></tr>'+items.map(p=>`<tr><td>${esc(p.kode||p.barcode||'-')}</td><td><b>${esc(p.nama)}</b></td><td>${esc(p.satuan||'pcs')}</td><td class="num">${p.opening}</td><td class="num">${rupiah(p.openingValue)}</td><td class="num">${p.incoming}</td><td class="num">${rupiah(p.incomingValue)}</td><td class="num">${p.outgoing}</td><td class="num">${rupiah(p.outgoingValue)}</td><td class="num"><b style="${p.ending<0?'color:#c2410c':''}">${p.ending}</b>${p.ending<0?' <span class="pill" style="background:#fff0e8;color:#b65b20">Minus</span>':''}</td><td class="num"><b>${rupiah(p.endingValue)}</b></td><td>${rupiah(p.cost)}</td></tr>`).join('')).join('');document.getElementById('stock_report').innerHTML=`<div class="cards"><div class="stat"><div class="stat-top">Stok Awal</div><strong>${sum('opening').toLocaleString('id-ID')}</strong><small>Nilai ${rupiah(sum('openingValue'))}</small></div><div class="stat"><div class="stat-top">Barang Masuk</div><strong>${sum('incoming').toLocaleString('id-ID')}</strong><small>Nilai ${rupiah(sum('incomingValue'))}</small></div><div class="stat"><div class="stat-top">Barang Keluar</div><strong>${sum('outgoing').toLocaleString('id-ID')}</strong><small>Nilai ${rupiah(sum('outgoingValue'))}</small></div><div class="stat"><div class="stat-top">Stok Akhir</div><strong>${sum('ending').toLocaleString('id-ID')}</strong><small>Nilai persediaan ${rupiah(sum('endingValue'))}</small></div></div><div class="panel"><div class="pagehead"><div><h3 style="margin:0">Laporan Posisi dan Mutasi Stok Barang</h3><div class="sub">Periode: ${esc(document.getElementById('stock_start').value)} – ${esc(document.getElementById('stock_end').value)}</div></div><span class="pill">${rows.length} barang</span></div><div class="tablewrap"><table id="stock_table"><thead><tr><th rowspan="2">Kode</th><th rowspan="2">Nama Barang</th><th rowspan="2">Satuan</th><th colspan="2">AWAL</th><th colspan="2">MASUK</th><th colspan="2">KELUAR</th><th colspan="2">AKHIR</th><th rowspan="2">Harga Modal/Unit</th></tr><tr><th>Qty</th><th>Nilai Persediaan</th><th>Qty</th><th>Nilai Persediaan</th><th>Qty</th><th>Nilai Persediaan</th><th>Qty</th><th>Nilai Persediaan</th></tr></thead><tbody>${body||'<tr><td colspan="12" class="empty">Tidak ada barang yang cocok.</td></tr>'}</tbody><tfoot><tr style="font-weight:800;background:#f5f7f8"><td colspan="3">TOTAL</td><td>${sum('opening')}</td><td>${rupiah(sum('openingValue'))}</td><td>${sum('incoming')}</td><td>${rupiah(sum('incomingValue'))}</td><td>${sum('outgoing')}</td><td>${rupiah(sum('outgoingValue'))}</td><td>${sum('ending')}</td><td>${rupiah(sum('endingValue'))}</td><td>—</td></tr></tfoot></table></div></div>`}
function exportStockReport(){const rows=getStockRows(),head=['kode','nama','kelompok','satuan','stok_awal_qty','stok_awal_nilai','masuk_qty','masuk_nilai','keluar_qty','keluar_nilai','stok_akhir_qty','stok_akhir_nilai','harga_modal_unit'],data=rows.map(p=>[p.kode||p.barcode,p.nama,p.kategori,p.satuan||'pcs',p.opening,p.openingValue,p.incoming,p.incomingValue,p.outgoing,p.outgoingValue,p.ending,p.endingValue,p.cost]);download('seamart-posisi-mutasi-stok.csv',[head,...data].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n'))}
function printStockReport(){
 const rows=getStockRows(),start=document.getElementById('stock_start').value,end=document.getElementById('stock_end').value,printedAt=new Date().toLocaleString('id-ID',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}),w=window.open('','_blank','width=1200,height=800');
 if(!w)return alert('Izinkan pop-up untuk mencetak atau menyimpan PDF.');
 const keys=['opening','openingValue','incoming','incomingValue','outgoing','outgoingValue','ending','endingValue'];
 const totals=Object.fromEntries(keys.map(k=>[k,rows.reduce((n,p)=>n+(Number(p[k])||0),0)]));
 const groups={};rows.forEach(p=>(groups[p.kategori||'Umum']??=[]).push(p));
 const fmt=n=>(Number(n)||0).toLocaleString('id-ID'),money=n=>'Rp '+fmt(n),escv=v=>esc(v==null||v===''?'-':v);
 const makeProductRow=p=>'<tr><td>'+escv(p.kode)+'</td><td>'+escv(p.barcode)+'</td><td class="name">'+escv(p.nama)+'</td><td>'+fmt(p.opening)+'</td><td>'+money(p.openingValue)+'</td><td>'+fmt(p.incoming)+'</td><td>'+money(p.incomingValue)+'</td><td>'+fmt(p.outgoing)+'</td><td>'+money(p.outgoingValue)+'</td><td>'+fmt(p.ending)+'</td><td>'+money(p.endingValue)+'</td></tr>';
 const subtotalRow=(cat,items)=>{const t=Object.fromEntries(keys.map(k=>[k,items.reduce((n,p)=>n+(Number(p[k])||0),0)]));return '<tr class="subtotal"><td colspan="3">SUBTOTAL '+escv(cat)+'</td><td>'+fmt(t.opening)+'</td><td>'+money(t.openingValue)+'</td><td>'+fmt(t.incoming)+'</td><td>'+money(t.incomingValue)+'</td><td>'+fmt(t.outgoing)+'</td><td>'+money(t.outgoingValue)+'</td><td>'+fmt(t.ending)+'</td><td>'+money(t.endingValue)+'</td></tr>';};
 const pageRows=[];let current=[],used=0;const pageCapacity=42,chunkSize=40;
 const addBlock=(htmlText,rowCount)=>{if(used+rowCount>pageCapacity&&current.length){pageRows.push(current.join(''));current=[];used=0;}current.push(htmlText);used+=rowCount;};
 Object.entries(groups).forEach(([cat,items])=>{
  for(let offset=0;offset<items.length;offset+=chunkSize){
   const part=items.slice(offset,offset+chunkSize),isFirst=offset===0,isLast=offset+chunkSize>=items.length;
   const block=(isFirst?'<tr class="group"><td colspan="11">'+escv(cat)+'</td></tr>':'<tr class="group"><td colspan="11">'+escv(cat)+' (lanjutan)</td></tr>')+part.map(makeProductRow).join('')+(isLast?subtotalRow(cat,items):'');
   addBlock(block,part.length+1+(isLast?1:0));
  }
 });
 if(current.length||!pageRows.length)pageRows.push(current.join(''));
 const grand='<tr class="grand"><td colspan="3">GRAND TOTAL</td><td>'+fmt(totals.opening)+'</td><td>'+money(totals.openingValue)+'</td><td>'+fmt(totals.incoming)+'</td><td>'+money(totals.incomingValue)+'</td><td>'+fmt(totals.outgoing)+'</td><td>'+money(totals.outgoingValue)+'</td><td>'+fmt(totals.ending)+'</td><td>'+money(totals.endingValue)+'</td></tr>';
 const pages=pageRows.map((body,i)=>'<section class="page"><header><h2>SEAMART — POSISI DAN MUTASI STOK BARANG</h2><p>Periode: '+escv(start)+' – '+escv(end)+'</p><p class="printed">Tanggal Cetak: '+printedAt+'</p></header><table><thead><tr><th>Kode</th><th>Barcode</th><th>Nama Barang</th><th>Awal Qty</th><th>Awal Nilai</th><th>Masuk Qty</th><th>Masuk Nilai</th><th>Keluar Qty</th><th>Keluar Nilai</th><th>Akhir Qty</th><th>Nilai Persediaan</th></tr></thead><tbody>'+body+(i===pageRows.length-1?grand:'')+'</tbody></table>'+(i===pageRows.length-1?'<div class="summary"><b>Total Item Barang: '+fmt(rows.length)+'</b><b>Total Qty Barang: '+fmt(totals.ending)+'</b></div>':'')+'<footer>Halaman '+(i+1)+' dari '+pageRows.length+'</footer></section>').join('');
 w.document.write('<!doctype html><html><head><title>SeaMart - Posisi & Mutasi Stok</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{font:8px Arial,sans-serif;color:#222}.page{position:relative;padding:5mm 6mm 10mm;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}header{text-align:center;margin:0 0 5px}h2{font-size:11px;margin:0 0 2px}header p{font-size:7px;margin:0 0 2px}.printed{font-size:7px;color:#555;margin:0 0 5px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #aaa;padding:1.7px 2px;text-align:right;line-height:1.08;overflow-wrap:anywhere}th{background:#eaf1ed;font-size:6.6px;text-align:center}td{font-size:6.6px}td:nth-child(1),td:nth-child(2),td.name{text-align:left}td:nth-child(1){width:8%}td:nth-child(2){width:10%}td.name{width:20%}.group td{background:#e8f3ec;text-align:left;font-weight:800;color:#24583c;padding:3px 2px}.subtotal td{background:#f1f4f2;font-weight:800;border-top:1.5px solid #64776a}.grand td{background:#dcebe1;font-weight:900;border-top:2px solid #315b43}.summary{display:flex;justify-content:flex-end;gap:18px;border:1px solid #87998d;padding:4px 6px;margin-top:5px;font-size:8px}footer{position:absolute;bottom:3mm;right:6mm;font-size:7px;color:#555}.report-actions{display:flex;justify-content:center;gap:7px;margin:8px auto}.report-actions button{border:0;border-radius:5px;padding:6px 10px;font-size:10px;background:#087b43;color:#fff;cursor:pointer}.report-actions button.save{background:#245a9a}.report-help{text-align:center;font-size:9px;margin:0 0 8px;color:#667}@media print{.report-actions,.report-help{display:none!important}.page{padding:5mm 6mm 10mm}}@page{size:A4 landscape;margin:0}</style></head><body>'+pages+'<div class="report-actions"><button onclick="window.print()">Cetak</button><button class="save" onclick="window.print()">Simpan PDF</button></div><p class="report-help">Untuk menyimpan: pada jendela cetak, buka Tujuan / Destination → pilih Simpan sebagai PDF → klik Simpan.</p></body></html>');
 w.document.close();
}
function nextSupplierCode(){const nums=(db.suppliers||[]).map(x=>Number(String(x.kode||'').replace(/^SUP-/i,''))).filter(Number.isFinite);return 'SUP-'+String(Math.max(0,...nums)+1).padStart(4,'0')}
function suppliersPage(){const rows=db.suppliers||[];document.getElementById('view').innerHTML='<div class="pagehead"><div><h1>Master Data Supplier</h1><div class="sub">Daftar pemasok barang SeaMart.</div></div><button class="btn-primary" onclick="supplierModal()">＋ Tambah Supplier</button></div><div class="panel"><div class="toolbar"><input id="supplierSearch" class="field search" placeholder="Cari kode, nama, kontak..." oninput="renderSuppliers()"></div><div id="supplierTable"></div></div>';renderSuppliers()}
function renderSuppliers(){const q=(document.getElementById('supplierSearch')?.value||'').toLowerCase(),rows=(db.suppliers||[]).filter(x=>[x.kode,x.nama,x.kontak,x.telepon,x.alamat].join(' ').toLowerCase().includes(q)),el=document.getElementById('supplierTable');if(!el)return;el.innerHTML=rows.length?'<div class="tablewrap"><table><thead><tr><th>Kode</th><th>Nama Supplier</th><th>Kontak / Sales</th><th>Telepon</th><th>Alamat</th><th>Aksi</th></tr></thead><tbody>'+rows.map(x=>'<tr><td><b>'+esc(x.kode)+'</b></td><td>'+esc(x.nama)+'</td><td>'+esc(x.kontak||'-')+'</td><td>'+esc(x.telepon||'-')+'</td><td>'+esc(x.alamat||'-')+'</td><td><button class="btn-light" data-id="'+esc(x.id)+'" onclick="supplierModal(this.dataset.id)">Ubah</button> <button class="btn-danger" data-id="'+esc(x.id)+'" onclick="deleteSupplier(this.dataset.id)">Hapus</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Belum ada supplier. Klik Tambah Supplier untuk membuat data pertama.</div>'}
function supplierModal(id){const x=(db.suppliers||[]).find(y=>y.id===id)||{id:'sup-'+Date.now(),kode:nextSupplierCode(),nama:'',kontak:'',telepon:'',alamat:'',catatan:''};document.getElementById('modalroot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>'+(id?'Ubah':'Tambah')+' Supplier</h2><label>Kode Supplier (otomatis)<input class="field" value="'+esc(x.kode)+'" readonly style="width:100%;margin:6px 0 12px"></label><label>Nama Supplier *<input id="sup_nama" class="field" value="'+esc(x.nama)+'" placeholder="Nama perusahaan / toko" style="width:100%;margin:6px 0 12px"></label><label>Nama Sales / Kontak<input id="sup_kontak" class="field" value="'+esc(x.kontak||'')+'" style="width:100%;margin:6px 0 12px"></label><label>Telepon / WhatsApp<input id="sup_telepon" class="field" value="'+esc(x.telepon||'')+'" style="width:100%;margin:6px 0 12px"></label><label>Alamat<input id="sup_alamat" class="field" value="'+esc(x.alamat||'')+'" style="width:100%;margin:6px 0 12px"></label><label>Catatan<input id="sup_catatan" class="field" value="'+esc(x.catatan||'')+'" style="width:100%;margin:6px 0 12px"></label><div class="actions"><button class="btn-light" onclick="closeModal()">Batal</button><button class="btn-primary" data-id="'+esc(x.id)+'" data-code="'+esc(x.kode)+'" onclick="saveSupplier(this.dataset.id,this.dataset.code)">Simpan Supplier</button></div></div></div>'}
function saveSupplier(id,kode){const nama=document.getElementById('sup_nama').value.trim();if(!nama)return alert('Nama supplier wajib diisi.');const x={id,kode,nama,kontak:document.getElementById('sup_kontak').value.trim(),telepon:document.getElementById('sup_telepon').value.trim(),alamat:document.getElementById('sup_alamat').value.trim(),catatan:document.getElementById('sup_catatan').value.trim()};const i=db.suppliers.findIndex(y=>y.id===id);if(i>=0)db.suppliers[i]=x;else db.suppliers.push(x);save();closeModal();suppliersPage()}
function deleteSupplier(id){const used=(db.purchaseInvoices||[]).some(x=>x.supplierId===id);if(used)return alert('Supplier sudah dipakai pada faktur pembelian, tidak bisa dihapus.');if(!confirm('Hapus data supplier ini?'))return;db.suppliers=db.suppliers.filter(x=>x.id!==id);save();suppliersPage()}

function moveModal(){window.movePurchaseItems=[];let opts=db.products.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.nama)+' · '+esc(p.kode||p.barcode||'')+'</option>').join('');document.getElementById('modalroot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(720px,100%)"><h2>Faktur Pembelian dari Supplier</h2><label>Pilih Supplier<select id="m_supplier" class="field" style="width:100%;margin:6px 0 10px">'+(db.suppliers||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.kode)+' · '+esc(x.nama)+'</option>').join('')+'</select> <small class="muted">Belum ada supplier? Tambahkan melalui menu Data Supplier.</small></label><div class="formgrid"><label>No. Faktur Supplier<input id="m_invoice_no" class="field" placeholder="Nomor faktur" style="width:100%;margin:6px 0 10px"></label><label>Tanggal Pembelian<input id="m_invoice_date" type="date" class="field" value="'+new Date().toISOString().slice(0,10)+'" style="width:100%;margin:6px 0 10px"></label></div><div class="panel" style="padding:14px;margin:8px 0"><h3>Tambah Barang ke Faktur</h3><label>Cari barang<input id="m_search" class="field" placeholder="Nama, kode, barcode" style="width:100%;margin:6px 0 8px" oninput="filterMoveProducts()"></label><label>Barang<select id="m_prod" class="field" style="width:100%;margin:6px 0 10px" size="4" onchange="updateMoveCost()">'+opts+'</select></label><div class="formgrid"><label>Harga beli satuan<input id="m_cost" type="text" inputmode="numeric" class="field" oninput="formatMoveCostInput(this);updateMovePreview()" style="width:100%;margin:6px 0 10px"></label><label>Jumlah beli<input id="m_qty" type="number" min="1" value="1" class="field" oninput="updateMovePreview()" style="width:100%;margin:6px 0 10px"></label></div><div id="movePurchasePreview" class="notice" style="margin:4px 0 12px">Pilih barang dan isi harga beli serta jumlah untuk melihat subtotal otomatis.</div><button class="btn-primary" type="button" onclick="addMovePurchaseItem()">＋ Tambahkan Barang</button></div><h3>Barang Terpilih</h3><div id="movePurchaseList"><div class="empty">Belum ada barang dipilih.</div></div><div class="totalrow grand"><span>Total Pembelian</span><strong id="movePurchaseTotal">Rp0</strong></div><label>Catatan<input id="m_note" class="field" style="width:100%;margin:8px 0"></label><div class="actions"><button class="btn-light" onclick="closeModal()">Batal</button><button class="btn-primary" onclick="saveMove()">Simpan Faktur Pembelian</button></div></div></div>';updateMoveCost();renderMovePurchaseItems()}
function filterMoveProducts(){const q=(document.getElementById('m_search')?.value||'').toLowerCase().trim(),sel=document.getElementById('m_prod');if(!sel)return;[...sel.options].forEach(o=>{const p=db.products.find(x=>String(x.id)===o.value);o.hidden=!!q&&!([p?.nama,p?.kode,p?.barcode].some(v=>String(v||'').toLowerCase().includes(q)))});const first=[...sel.options].find(o=>!o.hidden);if(first){sel.value=first.value;updateMoveCost();updateMovePreview()}}
function formatMoveCostInput(el){const digits=String(el.value||'').replace(/\D/g,'');el.value=digits?Number(digits).toLocaleString('id-ID'):''}
function updateMoveCost(){const id=document.getElementById('m_prod')?.value,p=db.products.find(x=>String(x.id)===String(id)),cost=document.getElementById('m_cost');if(cost)cost.value=Number(p?.harga_beli||0).toLocaleString('id-ID');updateMovePreview()}
function formatMoveAmount(value){return Number(value||0).toLocaleString('id-ID')}

let seamartOrderNotifications=[];

function stopSeaMartOrderAlarm(){
 if(seamartOrderAlarmTimer){clearInterval(seamartOrderAlarmTimer);seamartOrderAlarmTimer=null;}
}
function playSeaMartAlarmTone(){
 try{
  if(!seamartOrderAudioContext)return;
  const ctx=seamartOrderAudioContext;
  if(ctx.state==='suspended')return;
  const now=ctx.currentTime;
  // Original soft, iPhone-style notification chime (not an extracted Apple ringtone).
  // Two bright bell-like notes with a gentle harmonic layer.
  [{f:784,t:0,d:.24},{f:988,t:.19,d:.34}].forEach(note=>{
   [1,2.01].forEach((harmonic,index)=>{
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    const start=now+note.t,peak=index===0?.105:.025;
    osc.type='sine';osc.frequency.setValueAtTime(note.f*harmonic,start);
    gain.gain.setValueAtTime(.0001,start);
    gain.gain.exponentialRampToValueAtTime(peak,start+.018);
    gain.gain.exponentialRampToValueAtTime(.0001,start+note.d);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+note.d+.015);
   });
  });
 }catch(e){console.warn('Alarm SeaMart:',e);}
}
async function unlockSeaMartOrderSound(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return false;
  if(!seamartOrderAudioContext)seamartOrderAudioContext=new AudioCtx();
  if(seamartOrderAudioContext.state==='suspended')await seamartOrderAudioContext.resume();
  seamartOrderAlarmUnlocked=seamartOrderAudioContext.state==='running';
  return seamartOrderAlarmUnlocked;
 }catch(e){console.warn('Suara belum dapat diaktifkan:',e);return false;}
}

function getSeaMartPreferredMaleVoice(voices){

 channel.on('postgres_changes',{event:'*',schema:'public',table:'online_orders',filter:'store_id=eq.'+store},function(payload){
  if(payload.eventType==='INSERT')receiveSeaMartOrderNotification(payload.new||{});

 window.seamartOrderChannel=channel;

async function compressProductPhoto(file){
 const sourceUrl=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('File gambar tidak dapat dibaca'));image.src=sourceUrl});
  const scale=Math.min(1,1200/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
  const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
  return await new Promise(resolve=>canvas.toBlob(blob=>resolve(blob||file),'image/jpeg',.84));
 }finally{URL.revokeObjectURL(sourceUrl)}
}
async function importProductPhotosZip(){
 const input=document.getElementById('bulkPhotoZip'),file=input?.files?.[0],button=document.getElementById('bulkPhotoStart');
 if(!file)return alert('Pilih file ZIP foto barang terlebih dahulu.');
 if(file.size>150*1024*1024)return alert('Ukuran ZIP melebihi 150 MB. Bagi foto menjadi beberapa ZIP yang lebih kecil.');
 const sb=window.seamartSupabase,store=window.seamartStoreId;
 if(!sb||!store)return alert('SeaMart belum terhubung ke cloud. Login sebagai admin dan pastikan koneksi Supabase aktif.');
 if(!Array.isArray(db.products)||!db.products.length)return alert('Daftar barang belum dimuat. Muat ulang halaman lalu coba lagi.');
 button.disabled=true;button.textContent='Memeriksa ZIP…';
 const stats={ok:0,fail:0,skip:0};let entries=[];
 try{
  const JSZip=await loadSeaMartZipLibrary(),zip=await JSZip.loadAsync(file);
  entries=Object.values(zip.files).filter(x=>!x.dir&&/\.(jpe?g|png|webp)$/i.test(x.name));
  if(!entries.length)throw new Error('Tidak ada file JPG, PNG, atau WEBP di dalam ZIP.');
  if(entries.length>1000)throw new Error('ZIP berisi '+entries.length+' foto. Batas satu kali impor adalah 1.000 foto; bagi menjadi beberapa ZIP.');
  if(!confirm('Impor '+entries.length+' foto dari '+file.name+'? Foto hanya dipasang jika barcode cocok tepat satu barang. Foto lama akan diganti untuk barang yang cocok.'))return;
  const productsByBarcode=new Map();
  db.products.forEach(p=>{const code=String(p.barcode||'').replace(/\D/g,'');if(code){if(!productsByBarcode.has(code))productsByBarcode.set(code,[]);productsByBarcode.get(code).push(p)}});
  const candidates=[],barcodes=new Set();
  for(const entry of entries){
   const filename=entry.name.split('/').pop(),match=filename.match(/\d{8,14}/);
   if(!match){stats.skip++;continue;}
   const barcode=match[0],localMatches=productsByBarcode.get(barcode)||[];
   if(localMatches.length!==1){stats.skip++;continue;}
   candidates.push({entry,barcode,product:localMatches[0]});barcodes.add(barcode);
  }
  if(!candidates.length){setBulkPhotoProgress(100,'Tidak ada foto yang cocok dengan master barang.',stats);alert('Tidak ada foto yang cocok. Pastikan nama file diawali barcode barang.');return;}
  setBulkPhotoProgress(1,'Memeriksa '+candidates.length+' barcode di database cloud…',stats);
  const cloudByBarcode=new Map(),codes=[...barcodes];
  for(let i=0;i<codes.length;i+=100){
   const batch=codes.slice(i,i+100);
   const result=await sb.from('products').select('id,barcode').eq('store_id',store).in('barcode',batch);
   if(result.error)throw result.error;
   for(const row of (result.data||[])){
    const code=String(row.barcode||'').replace(/\D/g,'');
    if(!cloudByBarcode.has(code))cloudByBarcode.set(code,[]);
    cloudByBarcode.get(code).push(row);
   }
  }
  const ready=[];
  for(const item of candidates){
   const rows=cloudByBarcode.get(item.barcode)||[];
   if(rows.length!==1){stats.skip++;continue;}
   item.cloud=rows[0];ready.push(item);
  }
  if(!ready.length){setBulkPhotoProgress(100,'Tidak ada barcode yang cocok tepat satu barang di cloud.',stats);alert('Tidak ada foto yang bisa dipasang. Periksa barcode master barang dan database cloud.');return;}
  let next=0,done=0;
  const worker=async()=>{
   while(true){
    const index=next++;if(index>=ready.length)return;
    const item=ready[index],filename=item.entry.name.split('/').pop();
    try{
     const raw=await item.entry.async('blob');
     if(!raw||!raw.size)throw new Error('Gambar kosong atau rusak');
     const imageBlob=await compressProductPhoto(raw);
     if(!imageBlob||!imageBlob.size)throw new Error('Gagal memproses gambar');
     const cloudId=item.cloud.id,path=store+'/'+cloudId+'.jpg';
     const upload=await sb.storage.from('seamart-product-photos').upload(path,imageBlob,{contentType:'image/jpeg',upsert:true,cacheControl:'3600'});
     if(upload.error)throw upload.error;
     const baseUrl=sb.storage.from('seamart-product-photos').getPublicUrl(path).data.publicUrl;
     const publicUrl=baseUrl+(baseUrl.includes('?')?'&':'?')+'v='+Date.now();
     const update=await sb.from('products').update({image_url:publicUrl}).eq('id',cloudId).eq('store_id',store);
     if(update.error)throw update.error;
     item.product.foto=publicUrl;item.product.image_url=publicUrl;stats.ok++;
    }catch(err){stats.fail++;console.warn('Impor foto gagal untuk '+item.barcode+' ('+filename+')',err)}
    done++;
    setBulkPhotoProgress(done/ready.length*100,'Mengunggah '+done+' dari '+ready.length+' foto…',stats);
   }
  };
  await Promise.all(Array.from({length:Math.min(3,ready.length)},()=>worker()));
  save();
  const message='Impor selesai dari '+entries.length+' file. Berhasil '+stats.ok+', gagal '+stats.fail+', dilewati '+stats.skip+'.';
  setBulkPhotoProgress(100,message,stats);
  alert('Impor foto selesai. Berhasil: '+stats.ok+' · Gagal: '+stats.fail+' · Dilewati: '+stats.skip+'.');
 }catch(err){setBulkPhotoProgress(0,'Impor terhenti: '+(err.message||err),stats);alert('Impor foto gagal: '+(err.message||err))}
 finally{button.disabled=false;button.textContent='Mulai Impor Foto ZIP';}
}

async function importProductPhotoSources(){

 if(!sb||!store)return alert('Login admin dan koneksi cloud SeaMart harus aktif.');
 if(!Array.isArray(db.products)||!db.products.length)return alert('Master barang belum dimuat.');

 const files=['product-photo-sources-batch-01.csv','product-photo-sources-batch-02.csv','product-photo-sources-batch-03.csv','product-photo-sources-batch-04.csv','product-photo-sources-batch-05.csv','product-photo-sources-batch-06.csv','product-photo-sources-batch-07.csv'];
 const stats={ok:0,skip:0,fail:0};const skipped=[],failed=[];let records=[];
 try{

   }
  }
  const unique=new Map();records.forEach(x=>unique.set(x.barcode||('name:'+x.name.trim().toLowerCase()),x));records=[...unique.values()];

    const local=db.products.filter(p=>item.barcode?String(p.barcode||'').trim()===item.barcode:normName(p.nama)===normName(item.name));
    if(local.length>1){
     stats.skip++;skipped.push((item.barcode||item.name)+' — data ganda di master lokal');
    }else{
     const query=sb.from('products').select('id,barcode,name').eq('store_id',store);
     const q=item.barcode?await query.eq('barcode',item.barcode):await query.eq('name',item.name);
     if(q.error)throw q.error;
     if(!q.data||q.data.length!==1){
      stats.skip++;skipped.push((item.barcode||item.name)+' — '+(!q.data||q.data.length===0?'produk tidak ditemukan di cloud':'data ganda di cloud'));
     }else{
      const cloudName=String(q.data[0].name||'').trim();
      const targetName=local[0]?.nama||cloudName||item.name;
      await validateProductPhoto(item.url,targetName,item.name);
      const upd=await sb.from('products').update({image_url:item.url}).eq('id',q.data[0].id).eq('store_id',store);
      if(upd.error)throw upd.error;
      if(local[0]){local[0].image_url=item.url;local[0].foto=item.url;}
      stats.ok++;
      if(!local[0])skipped.push(item.barcode+' — foto dipasang ke cloud; produk belum ada di master lokal perangkat ini');
     }
    }
   }catch(e){stats.fail++;failed.push((item.barcode||item.name)+' — '+(e.message||String(e)));console.warn('Foto '+item.barcode,e)}
   done++;setBulkPhotoProgress(done/records.length*100,'Memasang foto '+done+'/'+records.length+'…',stats);
  }
  save();const msg='Selesai. Terpasang '+stats.ok+', dilewati '+stats.skip+', gagal '+stats.fail+'.';
  setBulkPhotoProgress(100,msg,stats);
  const details=[msg];
  if(skipped.length)details.push('DILEWATI:\n'+skipped.join('\n'));
  if(failed.length)details.push('GAGAL:\n'+failed.join('\n'));
  alert(details.join('\n\n'));
 }catch(e){alert('Pemasangan foto gagal: '+(e.message||e))}
 finally{if(button){button.disabled=false;button.textContent='Pasang Foto dari Daftar SeaMart';}}
}

async function publishPcMasterToCloud(){
 const sb=window.seamartSupabase,store=window.seamartStoreId;
 if(!sb||!store)return alert('Login cloud belum aktif. Login ulang dahulu.');
 if(currentUser?.role!=='admin')return alert('Hanya admin yang boleh menetapkan master utama.');
 if(!Array.isArray(db.products)||!db.products.length)return alert('Master barang PC kosong. Proses dibatalkan.');
 if(!confirm('Jadikan master barang dan stok pada PC ini sebagai sumber utama cloud? Data barang dan stok di cloud akan diperbarui mengikuti PC. Riwayat transaksi tidak dihapus. Sebaiknya unduh backup terlebih dahulu.'))return;
 download('seamart-backup-sebelum-master-cloud.json',JSON.stringify(db,null,2));
 const btn=document.getElementById('publishPcMasterButton');if(btn){btn.disabled=true;btn.textContent='Mengirim master PC…';}
 const summary={added:0,failed:0,errors:[]},cache=new Map(),total=db.products.length;
 updateSeaMartSyncProgress(0,'Mengirim master barang dari PC ke cloud',{total,added:0,skipped:0,failed:0});
 for(let i=0;i<total;i++){
  const p=db.products[i];
  try{await syncOneProduct(p,cache);summary.added++;}
  catch(e){summary.failed++;if(summary.errors.length<8)summary.errors.push((p.nama||p.kode||('Baris '+(i+1)))+': '+(e.message||String(e)));}
  if((i+1)%10===0||i===total-1){
   const pct=Math.round((i+1)/total*100);
   updateSeaMartSyncProgress(pct,'Mengirim '+(i+1)+' dari '+total+' barang dari PC',{total,added:summary.added,skipped:0,failed:summary.failed,finished:i===total-1});
  }
 }
 if(btn){btn.disabled=false;btn.textContent='Kirim Master PC ke Cloud';}
 if(summary.failed){
  alert('Master PC belum seluruhnya tersinkron. Berhasil: '+summary.added+'; gagal: '+summary.failed+'.\n'+summary.errors.join('\n'));
 }else{
  localStorage.setItem('seamart_master_source_v1','local');
  await refreshSeaMartCloudStock().catch(e=>console.warn(e));
  alert('Berhasil! '+summary.added+' barang dari PC sudah dikirim ke cloud. Sekarang login ulang di HP dan tablet untuk mengambil stok terbaru.');
 }
}

<script>
/* SeaMart universal search clear */
(function(){
 function enhance(root){
  (root||document).querySelectorAll('input:not([data-seamart-search])').forEach(function(el){
   const hint=((el.placeholder||'')+' '+(el.getAttribute('aria-label')||'')+' '+el.id).toLowerCase();
   if(!(el.type==='search'||el.classList.contains('search')||/cari|search/.test(hint)))return;
   el.dataset.seamartSearch='1';
   if(el.type==='text'||el.type==='')el.type='search';
   el.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'&&el.value){el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('search',{bubbles:true}));el.focus();ev.preventDefault();}
   });
  });
 }
 enhance(document);
 new MutationObserver(function(records){records.forEach(function(rec){rec.addedNodes.forEach(function(n){if(n.nodeType===1)enhance(n.matches?.('input')?n.parentElement:n);});});}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script>
(function(){
 if(window.__seamartStyledAlertInstalled)return;
 window.__seamartStyledAlertInstalled=true;
 window.alert=function(message){
  const old=document.getElementById('smAlertOverlay');if(old)old.remove();
  const overlay=document.createElement('div');overlay.id='smAlertOverlay';
  const dialog=document.createElement('section');dialog.id='smAlertDialog';dialog.setAttribute('role','alertdialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','smAlertTitle');
  const head=document.createElement('div');head.className='sm-alert-head';
  const icon=document.createElement('div');icon.className='sm-alert-icon';icon.textContent='!';icon.setAttribute('aria-hidden','true');
  const title=document.createElement('div');title.className='sm-alert-title';title.id='smAlertTitle';title.textContent='Pemberitahuan';
  const close=document.createElement('button');close.className='sm-alert-close';close.type='button';close.textContent='×';close.setAttribute('aria-label','Tutup');
  head.append(icon,title,close);
  const content=document.createElement('div');content.className='sm-alert-content';content.textContent=String(message??'').replace(/\\n/g,'\n');
  const actions=document.createElement('div');actions.className='sm-alert-actions';
  const ok=document.createElement('button');ok.className='sm-alert-ok';ok.type='button';ok.textContent='Mengerti';
  actions.append(ok);dialog.append(head,content,actions);overlay.append(dialog);document.body.append(overlay);
  const done=()=>{overlay.remove();document.removeEventListener('keydown',keyHandler)};
  const keyHandler=e=>{if(e.key==='Escape'){e.preventDefault();done()}};
  ok.addEventListener('click',done);close.addEventListener('click',done);
  overlay.addEventListener('click',e=>{if(e.target===overlay)done()});
  document.addEventListener('keydown',keyHandler);ok.focus();
 };
})();
</script>
<script>
/* Reliable qty commit: Enter on the physical keyboard applies the visible quantity. */
(function(){
 if(window.__seamartQtyEnterCommitInstalled)return;
 window.__seamartQtyEnterCommitInstalled=true;
 document.addEventListener('keydown',function(event){
  const layout=document.getElementById('odooPosLayout');
  const panel=document.getElementById('cartScreenKeyboard');
  const display=document.getElementById('cartQtyDisplay');
  if(!layout||!panel||!display||!layout.getClientRects().length)return;
  const code=event.code||'',key=event.key||'',kc=event.keyCode||event.which||0;
  const isEnter=key==='Enter'||code==='NumpadEnter'||kc===13;
  if(!isEnter||window.cartKeyMode!=='qty')return;
  const value=String(display.value||window.cartKeyboardValue||'').trim();
  if(!value)return;
  event.preventDefault();
  event.stopImmediatePropagation();
  event.stopPropagation();
  window.cartKeyboardValue=value;
  applyCartKeyboard();
 },true);
})();

/* Laptop keyboard support for the integrated SeaMart POS keypad.
   Keep barcode/search inputs untouched so scanner-as-keyboard continues to work. */
(function(){
 if(window.__seamartLaptopKeypadInstalled)return;
 window.__seamartLaptopKeypadInstalled=true;
 document.addEventListener('keydown',function(event){
  const panel=document.getElementById('cartScreenKeyboard');
  const layout=document.getElementById('odooPosLayout');
  if(!panel||!layout||!layout.getClientRects().length)return;
  const active=document.activeElement;
  const display=document.getElementById('cartKeyboardDisplay'),qtyDisplay=document.getElementById('cartQtyDisplay');
  const isDisplay=active===display||active===qtyDisplay;
  const isOtherEditable=active&&active!==document.body&&active!==layout&&active!==display&&active!==qtyDisplay&&
   (active.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName));
  if(isOtherEditable)return;
  const key=event.key;
  // Saat kolom Qty sedang fokus, biarkan browser mengetik langsung.
  // Jangan kirim digit kedua kali melalui cartKey().
  if(active===qtyDisplay){
   if(key==='Enter'){event.preventDefault();event.stopImmediatePropagation();applyCartKeyboard();}
   return;
  }
  let mapped=null;
  if(/^[0-9]$/.test(key))mapped=key;
  else if(key==='Backspace')mapped='back';
  else if(key==='Delete'||key==='Escape')mapped='clear';
  else if(key==='+'||key==='Add')mapped='+';
  else if(key==='-'||key==='Subtract')mapped='-';
  else if(key==='.'||key===',')mapped='.';
  else if(key==='Enter'&&(active===qtyDisplay||window.cartKeyMode==='qty')){event.preventDefault();event.stopImmediatePropagation();applyCartKeyboard();return;}
  if(mapped===null)return;
  /* Type into the keypad when it is focused, or while the cashier page itself has focus. */
  const cashierFocus=isDisplay||active===document.body||active===layout||active?.closest?.('#odooOrderPanel');
  if(!cashierFocus)return;
  event.preventDefault();
  if(typeof window.cartKey==='function')window.cartKey(mapped);
 },true);
})();
</script>

<script>
/* Keep category filters inside the catalog column, not as a third grid column. */
(function(){
 if(window.__seamartCategoryRelocationInstalled)return;
 window.__seamartCategoryRelocationInstalled=true;
 function place(){
  const layout=document.getElementById('odooPosLayout');
  if(!layout)return;
  const cats=layout.querySelector(':scope > .odoo-category-panel');
  const catalog=layout.querySelector(':scope > .odoo-catalog-panel');
  if(cats&&catalog&&cats.parentElement!==catalog){
   catalog.insertBefore(cats,catalog.firstChild);
   cats.dataset.seamartEmbedded='1';
  }
 }
 place();
 new MutationObserver(place).observe(document.getElementById('view')||document.body,{childList:true,subtree:true});
})();
</script>

/* Place category chips directly below the catalog search row, not in a third column. */
(function(){

})();

<script id="seamart-app-launcher-delegated-click-fix">
(function(){
 const routes=['dashboard','kasir','produk','stok','penjualan','akun','aruskas','pengaturan','pesanan'];
 function bind(){
  const root=document.getElementById('appLauncherBackdrop');
  if(!root||root.dataset.seamartClickBound==='1')return;
  root.dataset.seamartClickBound='1';
  root.addEventListener('click',function(e){
   const tile=e.target.closest('.launcher-tile');
   if(!tile)return;
   const attr=tile.getAttribute('onclick')||'';
   const match=attr.match(/openAppPage\(['"]([a-z]+)['"]\)/);
   const route=match&&match[1];
   if(!route||!routes.includes(route))return;
   e.preventDefault();e.stopPropagation();
   if(typeof window.openAppPage==='function')window.openAppPage(route);
   else if(typeof window.page==='function'){root.classList.remove('open');window.page(route);}
  },true);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();
})();
</script>

<script id="seamart-close-hit-test-v11">
(function(){
 function hardClose(){
  var panel=document.getElementById('odooOrderPanel');
  var backdrop=document.getElementById('mobileCartBackdrop');
  document.body.classList.remove('seamart-cart-open');
  if(panel){
   panel.style.setProperty('display','none','important');
   panel.style.setProperty('visibility','hidden','important');
   panel.style.setProperty('pointer-events','none','important');
   panel.setAttribute('aria-hidden','true');
  }
  if(backdrop){
   backdrop.style.setProperty('display','none','important');
   backdrop.style.setProperty('pointer-events','none','important');
  }
  ['mobileCartTrigger','posMobileCartFab'].forEach(function(id){
   var el=document.getElementById(id);if(el)el.setAttribute('aria-expanded','false');
  });
  document.documentElement.style.setProperty('overflow','auto','important');
  document.body.style.setProperty('overflow','auto','important');
 }
 function pointClose(event){
  var btn=document.querySelector('#odooOrderPanel .mobile-cart-close');
  if(!btn)return;
  var p=event.touches&&event.touches[0]?event.touches[0]:event.changedTouches&&event.changedTouches[0]?event.changedTouches[0]:event;
  if(!p||typeof p.clientX!=='number')return;
  var r=btn.getBoundingClientRect();
  if(p.clientX>=r.left-8&&p.clientX<=r.right+8&&p.clientY>=r.top-8&&p.clientY<=r.bottom+8){
   if(event.cancelable)event.preventDefault();
   event.stopImmediatePropagation();
   hardClose();
  }
 }
 document.addEventListener('touchstart',pointClose,{capture:true,passive:false});
 document.addEventListener('pointerdown',pointClose,true);
 document.addEventListener('click',function(e){
  if(e.target&&e.target.closest&&e.target.closest('#odooOrderPanel .mobile-cart-close')){
   e.preventDefault();e.stopImmediatePropagation();hardClose();
  }
 },true);
 window.seamartHardCloseCart=hardClose;
})();
</script>
