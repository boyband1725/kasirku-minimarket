/* Odoo-inspired POS workspace */
.odoo-pos-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.odoo-pos-head h1{margin:0 0 4px;font-size:25px}
.odoo-pos-tools{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.odoo-pos-tools .search{min-width:160px}
.odoo-pos-layout{display:grid;grid-template-columns:178px minmax(0,1fr) 350px;gap:14px;align-items:start}
.odoo-category-panel,.odoo-catalog-panel,.odoo-order-panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.odoo-category-panel{padding:12px;position:sticky;top:82px}
.odoo-panel-label{font-size:10px;font-weight:800;letter-spacing:1px;color:#89929c;padding:5px 8px 10px}
.odoo-cat{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:transparent;color:#47525d;padding:10px 9px;margin:2px 0;border-radius:8px;font-weight:600}
.odoo-cat:hover{background:#f3f7f5}.odoo-cat.active{background:var(--green2);color:var(--green)}
.odoo-cat-icon{width:25px;height:25px;display:grid;place-items:center;background:#f0f3f2;border-radius:7px;font-size:14px}
.odoo-cat.active .odoo-cat-icon{background:#d4eddf}
.odoo-catalog-panel{padding:15px;min-height:480px}
.odoo-catalog-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.odoo-catalog-top h3{margin:0;font-size:15px}.odoo-count{font-size:11px;color:var(--muted);background:#f4f6f7;padding:5px 8px;border-radius:20px}
.odoo-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px}
.odoo-product{position:relative;border:1px solid #e9edef;border-radius:10px;padding:9px;background:#fff;text-align:left;min-width:0;transition:.15s}
.odoo-product:hover{border-color:#69b18e;box-shadow:0 5px 15px #16845b12;transform:translateY(-1px)}
.odoo-product-image{height:104px;background:#f4f6f5;border-radius:7px;display:grid;place-items:center;overflow:hidden;font-size:34px;margin-bottom:9px}
.odoo-product-image img{width:100%;height:100%;object-fit:cover}
.odoo-product-name{font-size:12px;line-height:1.4;font-weight:700;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.odoo-product-meta{font-size:10px;color:#8a949d;margin-top:5px}
.odoo-product-price{font-size:13px;font-weight:800;color:var(--green);margin-top:7px}
.odoo-order-panel{position:sticky;top:82px;padding:0;overflow:hidden}
.odoo-order-head{padding:16px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.odoo-order-head h3{margin:0;font-size:15px}
.odoo-order-body{padding:13px 16px}
.odoo-order-lines{min-height:145px;max-height:36vh;overflow:auto}
.odoo-order-lines .empty{padding:38px 10px}
.odoo-order-panel .cartline{align-items:center}
.odoo-order-panel .grand{font-size:21px}
.odoo-pay-label{font-size:11px;color:var(--muted);font-weight:700}
.odoo-checkout{font-size:14px;padding:13px}
.odoo-scan-hint{font-size:11px;color:#87919a;margin-top:10px;text-align:center}
@media(max-width:1120px){.odoo-pos-layout{grid-template-columns:145px minmax(0,1fr) 310px;gap:10px}.odoo-products{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}}
@media(max-width:900px){.odoo-pos-layout{grid-template-columns:1fr}.odoo-category-panel{position:static;display:flex;gap:5px;overflow-x:auto;padding:8px}.odoo-panel-label{display:none}.odoo-cat{width:auto;white-space:nowrap;flex-shrink:0}.odoo-order-panel{position:static}.odoo-order-lines{max-height:260px}.odoo-products{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}}
@media(max-width:520px){.odoo-pos-head{align-items:flex-start}.odoo-pos-head h1{font-size:22px}.odoo-pos-tools{flex-wrap:wrap}.odoo-pos-tools .search{flex-basis:100%}.odoo-catalog-panel{padding:10px}.odoo-product-image{height:88px}.odoo-products{grid-template-columns:repeat(2,minmax(0,1fr))}}

}

}

/* SeaMart POS reference design */
:root{--green:#087b43;--green2:#d9f8e2;--nav:#064d35;--line:#e2eee7;--shadow:0 5px 18px rgba(8,90,53,.08)}
.sidebar{background:linear-gradient(180deg,#005b3d 0%,#06452f 100%);color:#e9fff1}
.brand{padding-bottom:25px}
.nav{color:#d7f3e2;border-radius:12px;padding:13px 14px}
.nav:hover{background:#087b43;color:#fff}
.nav.active{background:linear-gradient(135deg,#16bd53,#078b3c);color:#fff;box-shadow:0 5px 14px #002e1d55}
.topbar{background:linear-gradient(90deg,#078a45,#10a84c);color:#fff;border-bottom:0}
.topbar .crumb,.topbar .user{color:#fff}
.topbar .avatar{background:#d8ffe4;color:#087b43}
.content{background:#f5faf7}
.odoo-pos-head h1{color:#075b36}
.odoo-category-panel{padding:0 12px 14px;overflow:hidden;border-radius:16px}
.odoo-category-heading{margin:0 0 8px;padding:5px 8px;background:transparent;color:#47525d;border:0}
.odoo-category-heading .odoo-panel-label{color:#47525d;font-size:12px;letter-spacing:.5px;padding:0}
.odoo-cat{padding:11px 9px;border-radius:10px}
.odoo-cat.active{background:#bdf7ca;color:#064d2d}
.odoo-cat.active .odoo-cat-icon{background:#e4ffea}
.odoo-catalog-panel,.odoo-order-panel{border-radius:16px;border-color:#e5f0e9;box-shadow:0 5px 18px rgba(8,90,53,.07)}
.odoo-catalog-top h3{color:#075b36}
.odoo-product{border-radius:15px;border-color:#e5efea;padding:10px;box-shadow:0 3px 10px rgba(12,82,49,.06)}
.odoo-product:hover{border-color:#19a75a;box-shadow:0 7px 18px rgba(12,140,65,.13)}
.odoo-product-image{background:#f4faf6;border-radius:10px}
.odoo-product-price{background:#d8f9df;color:#075b36;border-radius:9px;padding:7px 8px;font-weight:800}

async function doLogin(){const email=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value,err=document.getElementById('cloudLoginError'),btn=document.getElementById('cloudLoginBtn');btn.disabled=true;btn.textContent='Menghubungkan…';err.textContent='';try{if(!window.supabase)throw new Error('Library Supabase belum termuat. Muat ulang halaman.');const sb=window.supabase.createClient('https://kvavvulwrrxfqtihmfnu.supabase.co','sb_publishable_Pb_d6PJahuegzMdGVPjeOQ_jw8OQoqV');const auth=await sb.auth.signInWithPassword({email,password});if(auth.error)throw auth.error;const member=await sb.from('store_members').select('store_id,role').eq('user_id',auth.data.user.id).limit(1).maybeSingle();if(member.error)throw member.error;if(!member.data)throw new Error('Akun belum terhubung ke toko SeaMart.');window.seamartSupabase=sb;window.seamartStoreId=member.data.store_id;const cats=await sb.from('categories').select('id,name').eq('store_id',member.data.store_id);if(cats.error)throw cats.error;const catNames=new Map((cats.data||[]).map(x=>[x.id,x.name]));const remoteRows=[];for(let from=0;from<10000;from+=500){const batch=await sb.from('products').select('id,code,barcode,name,category_id,price,stock,active').eq('store_id',member.data.store_id).range(from,from+499);if(batch.error)throw batch.error;remoteRows.push(...(batch.data||[]));if((batch.data||[]).length<500)break;}if(remoteRows.length){db.products=remoteRows.map(p=>({id:p.id,nama:p.name||'',kode:p.code||'',barcode:p.barcode||'',kategori:catNames.get(p.category_id)||'Umum',harga:Number(p.price||0),harga_jual_1:Number(p.price||0),harga_beli:0,harga_jual_2:0,harga_jual_3:0,stok:Number(p.stock||0),active:p.active!==false}));save();}await loadCategoryVisibility();currentUser={username:email,nama:auth.data.user.user_metadata?.name||email,role:member.data.role==='owner'?'admin':'kasir'};document.getElementById('loginroot').innerHTML='';document.getElementById('loginroot').style.display='none';document.getElementById('sessionUser').textContent=currentUser.nama+' · '+(currentUser.role==='admin'?'Admin':'Kasir');document.getElementById('sessionAvatar').textContent=currentUser.nama.slice(0,1).toUpperCase();document.querySelectorAll('.nav').forEach(b=>{b.style.display=currentUser.role==='kasir'&&!['kasir'].includes(b.dataset.page)?'none':''});document.getElementById('shiftAction').style.display='';document.getElementById('logoutAction').style.display='';updateShiftButton();page(currentUser.role==='kasir'?'kasir':'dashboard');}catch(e){err.textContent=e.message||'Login Supabase gagal';}finally{btn.disabled=false;btn.textContent='Masuk';}}function logout(){if(currentShift()){alert('Sesi kasir masih terbuka. Selesaikan Tutup Kasir terlebih dahulu, lalu tekan Keluar.');closeCashierShift();return;}currentUser=null;cart=[];document.querySelectorAll('.nav').forEach(b=>b.style.display='');document.getElementById('sessionUser').textContent='Belum login';document.getElementById('shiftAction').style.display='none';document.getElementById('logoutAction').style.display='none';showLogin();}

function toggleCashierShift(){if(!currentUser)return showLogin();if(currentShift())return closeCashierShift();const raw=prompt('Masukkan modal awal kas (Rp):','0');if(raw===null)return;const opening=Number(String(raw).replace(/[^0-9]/g,''));if(!Number.isFinite(opening)||opening<0)return alert('Modal awal tidak valid.');db.shifts.push({id:'SH-'+Date.now(),username:currentUser.username,nama:currentUser.nama,openedAt:new Date().toISOString(),opening,status:'open'});save();updateShiftButton();alert('Sesi kasir berhasil dibuka.');page('kasir');}
function closeCashierShift(){
 const sh=currentShift();if(!sh)return;
 const sales=db.sales.filter(x=>x.shiftId===sh.id||(!x.shiftId&&new Date(x.at||x.time).getTime()>=new Date(sh.openedAt).getTime()));
 const cash=sales.filter(x=>String(x.pay||'Tunai').toUpperCase()==='TUNAI').reduce((a,x)=>a+Number(x.total||0),0);
 const qris=sales.filter(x=>String(x.pay||'').toUpperCase()==='QRIS').reduce((a,x)=>a+Number(x.total||0),0);
 const total=cash+qris,expected=Number(sh.opening||0)+cash;
 document.getElementById('modalroot').innerHTML=`<div class="modalback" style="position:fixed;inset:0;background:#17212b99;z-index:100001;display:grid;place-items:center;padding:16px;overflow:auto"><div class="modal" style="width:min(420px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:14px;padding:16px;box-shadow:0 20px 60px #0004">
 <div style="display:flex;justify-content:space-between;align-items:start;gap:12px"><div><div style="font-size:11px;font-weight:800;letter-spacing:1px;color:#16845b">SEAMART POS</div><h2 style="margin:5px 0 3px;font-size:19px">Ringkasan Tutup Kasir</h2><div class="muted">Sesi ${esc(sh.id)} · ${esc(sh.nama||sh.username)}</div></div><button class="btn-light" onclick="closeModal()" type="button">Tutup</button></div>
 <div style="margin:16px 0;padding:12px;background:#f3f8f5;border-radius:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span><b>Tanggal buka</b><br>${new Date(sh.openedAt).toLocaleString('id-ID')}</span><span><b>Waktu tutup</b><br>${new Date().toLocaleString('id-ID')}</span></div>
 <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><div class="panel"><div class="muted">Jumlah transaksi</div><div style="font-size:24px;font-weight:800">${sales.length}</div></div><div class="panel"><div class="muted">Total penjualan</div><div style="font-size:20px;font-weight:800;color:#16845b">${rupiah(total)}</div></div><div class="panel"><div class="muted">Penjualan tunai</div><b style="font-size:17px">${rupiah(cash)}</b></div><div class="panel"><div class="muted">Penjualan QRIS</div><b style="font-size:17px">${rupiah(qris)}</b></div></div>
 <div style="margin-top:15px;border:1px solid #e8ebef;border-radius:12px;padding:14px"><h3 style="margin:0 0 10px">Perhitungan kas tunai</h3><div class="totalrow"><span>Modal awal kas</span><b>${rupiah(sh.opening)}</b></div><div class="totalrow"><span>Penjualan tunai</span><b>${rupiah(cash)}</b></div><div class="totalrow" style="font-size:16px"><b>Kas seharusnya</b><b>${rupiah(expected)}</b></div>
 <label style="display:grid;gap:7px;margin-top:14px;font-weight:700">Uang tunai fisik di laci (Rp)<input id="cashierClosingActual" type="number" min="0" step="1" inputmode="numeric" value="${expected}" oninput="updateCloseCashierDifference()" style="width:100%;padding:13px;border:1px solid #cbd8d0;border-radius:9px;font-size:18px"></label>
 <div class="totalrow" style="margin-top:12px;background:#f3f8f5;padding:12px;border-radius:8px"><b>Selisih kas</b><b id="closingDifferenceValue">Seimbang</b></div></div>
 <div style="margin-top:14px;padding:11px;background:#fff8e8;border-radius:9px;color:#72531b;font-size:12px">QRIS tidak dihitung sebagai uang tunai di laci. Pastikan jumlah uang fisik sudah dihitung sebelum menyelesaikan tutup kasir.</div>
 <div class="actions" style="justify-content:flex-end;flex-wrap:wrap;margin-top:14px"><button class="btn-light" type="button" onclick="closeModal()">Batal</button><button class="btn-light" type="button" onclick="printCashierClosing('${sh.id}')">Cetak Ringkasan</button><button class="btn-primary" type="button" onclick="finalizeCashierClosing('${sh.id}')">Simpan & Tutup Kasir</button></div>
 </div></div>`;
 updateCloseCashierDifference();
}
function updateCloseCashierDifference(){const sh=currentShift(),input=document.getElementById('cashierClosingActual'),out=document.getElementById('closingDifferenceValue');if(!sh||!input||!out)return;const sales=db.sales.filter(x=>x.shiftId===sh.id||(!x.shiftId&&new Date(x.at||x.time).getTime()>=new Date(sh.openedAt).getTime())),cash=sales.filter(x=>String(x.pay||'Tunai').toUpperCase()==='TUNAI').reduce((a,x)=>a+Number(x.total||0),0),expected=Number(sh.opening||0)+cash,actual=Number(input.value||0),diff=actual-expected;out.textContent=diff===0?'Seimbang':(diff>0?'Lebih '+rupiah(diff):'Kurang '+rupiah(Math.abs(diff)));out.style.color=diff===0?'#16845b':'#b45309';}
function finalizeCashierClosing(shiftId){const sh=currentShift();if(!sh||sh.id!==shiftId)return alert('Sesi kasir tidak ditemukan.');const input=document.getElementById('cashierClosingActual');if(!input||input.value===''||!Number.isFinite(Number(input.value))||Number(input.value)<0)return alert('Masukkan jumlah uang tunai fisik yang valid.');const sales=db.sales.filter(x=>x.shiftId===sh.id||(!x.shiftId&&new Date(x.at||x.time).getTime()>=new Date(sh.openedAt).getTime())),cash=sales.filter(x=>String(x.pay||'Tunai').toUpperCase()==='TUNAI').reduce((a,x)=>a+Number(x.total||0),0),qris=sales.filter(x=>String(x.pay||'').toUpperCase()==='QRIS').reduce((a,x)=>a+Number(x.total||0),0),actual=Number(input.value),expected=Number(sh.opening||0)+cash;sh.closedAt=new Date().toISOString();sh.status='closed';sh.transactionCount=sales.length;sh.cashSales=cash;sh.qrisSales=qris;sh.totalSales=cash+qris;sh.expectedCash=expected;sh.actualCash=actual;sh.difference=actual-expected;save();updateShiftButton();document.getElementById('modalroot').innerHTML='<div class="modalback" style="position:fixed;inset:0;background:#17212b99;z-index:100001;display:grid;place-items:center;padding:16px"><div class="modal" style="width:min(100%,520px);background:#fff;border-radius:16px;padding:24px;text-align:center"><div style="font-size:42px;color:#16845b">✓</div><h2>Kasir berhasil ditutup</h2><p class="muted">Ringkasan sesi tersimpan di perangkat ini.</p><div class="totalrow"><span>Total penjualan</span><b>'+rupiah(sh.totalSales)+'</b></div><div class="totalrow"><span>Kas seharusnya</span><b>'+rupiah(sh.expectedCash)+'</b></div><div class="totalrow"><span>Kas fisik</span><b>'+rupiah(sh.actualCash)+'</b></div><div class="totalrow"><span>Selisih</span><b>'+(sh.difference===0?'Seimbang':(sh.difference>0?'Lebih ':'Kurang ')+rupiah(Math.abs(sh.difference)))+'</b></div><div class="actions" style="justify-content:center"><button class="btn-light" onclick="closeModal()">Selesai</button><button class="btn-primary" onclick="printCashierClosing(\''+sh.id+'\')">Cetak Ringkasan</button></div></div></div>';}
async function printCashierClosing(shiftId){
 const sh=db.shifts.find(x=>x.id===shiftId);if(!sh)return alert('Data sesi kasir tidak ditemukan.');
 const sales=db.sales.filter(x=>x.shiftId===sh.id||(!x.shiftId&&new Date(x.at||x.time).getTime()>=new Date(sh.openedAt).getTime()));
 const cash=sales.filter(x=>String(x.pay||'Tunai').toUpperCase()==='TUNAI').reduce((a,x)=>a+Number(x.total||0),0);
 const qris=sales.filter(x=>String(x.pay||'').toUpperCase()==='QRIS').reduce((a,x)=>a+Number(x.total||0),0);
 const total=cash+qris,expected=Number(sh.opening||0)+cash;
 const actualInput=document.getElementById('cashierClosingActual');
 const actual=actualInput?Number(actualInput.value||0):Number(sh.actualCash??expected);
 const diff=actual-expected,fmt=n=>rupiah(Number(n)||0);
 const line=(label,value)=>({type:'text',text:label+': '+value,align:'center'});
 const content=[
  {type:'text',text:'SEAMART POS',align:'center',bold:true},
  {type:'text',text:'RINGKASAN TUTUP KASIR',align:'center',bold:true},
  {type:'text',text:'Sesi '+String(sh.id),align:'center'},
  {type:'text',text:new Date().toLocaleString('id-ID'),align:'center'},
  {type:'text',text:'--------------------------------',align:'center'},
  line('Kasir',String(sh.nama||sh.username||'-')),
  line('Jumlah transaksi',String(sales.length)),
  {type:'text',text:'--------------------------------',align:'center'},
  line('Penjualan tunai',fmt(cash)),
  line('Penjualan QRIS',fmt(qris)),
  line('TOTAL PENJUALAN',fmt(total)),
  {type:'text',text:'--------------------------------',align:'center'},
  line('Modal awal kas',fmt(sh.opening)),
  line('Kas seharusnya',fmt(expected)),
  line('Uang tunai fisik',fmt(actual)),
  line('Selisih kas',diff===0?'Seimbang':(diff>0?'Lebih ':'Kurang ')+fmt(Math.abs(diff))),
  {type:'text',text:'--------------------------------',align:'center'},
  {type:'text',text:'Kasir: ____________________',align:'center'},
  {type:'text',text:'Admin: ____________________',align:'center'},
  {type:'feed',lines:3}
 ];
 try{
  const health=await fetch('http://localhost:9100/health',{signal:AbortSignal.timeout(2500)});
  if(!health.ok)throw new Error('Aplikasi penghubung printer tidak merespons.');
  const status=await health.json();
  if(status.printer&&!status.printer.connected)throw new Error('Printer belum terhubung di aplikasi Cleanter. Pilih RPP02N sebagai printer utama.');
  const response=await fetch('http://localhost:9100/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paperWidth:58,cut:true,reference:'Tutup kasir '+String(sh.id),content}),signal:AbortSignal.timeout(20000)});
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(result.fix||result.detail||result.error||'Gagal mengirim cetakan ke printer.');
  alert('Ringkasan tutup kasir berhasil dikirim ke printer '+(status.printer?.name||'RPP02N')+'.');
 }catch(e){
  const msg=String(e&&e.message||e);
  if(msg.includes('Failed to fetch')||msg.includes('NetworkError')||msg.includes('fetch'))alert('Printer RPP02N belum bisa diakses langsung dari browser. Pastikan Cleanter aktif dan RPP02N terpilih.');
  else alert('Cetak gagal: '+msg);
 }
}

async function syncOneProduct(p,categoryCache=new Map()){
 const sb=window.seamartSupabase,store=window.seamartStoreId;
 if(!sb||!store)throw new Error('Koneksi cloud belum siap.');
 if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(p.id||'')))p.id=crypto.randomUUID();
 let categoryId=null;
 const categoryName=String(p.kategori||'Umum').trim();
 if(categoryName&&categoryGroupKey(categoryName)!=='umum'){
  if(!categoryCache.has(categoryGroupKey(categoryName))){
   categoryCache.set(categoryGroupKey(categoryName),(async()=>{
    let found=await sb.from('categories').select('id').eq('store_id',store).ilike('name',categoryName).limit(1).maybeSingle();
    if(found.error)throw found.error;
    if(found.data?.id)return found.data.id;
    const created=await sb.from('categories').insert({store_id:store,name:categoryName}).select('id').single();
    if(!created.error&&created.data?.id)return created.data.id;
    // Jika kategori dibuat hampir bersamaan dari perangkat lain, ambil ulang sebelum gagal.
    const retry=await sb.from('categories').select('id').eq('store_id',store).ilike('name',categoryName).limit(1).maybeSingle();
    if(retry.error)throw retry.error;
    if(retry.data?.id)return retry.data.id;
    throw created.error||new Error('Kategori '+categoryName+' gagal dibuat di cloud.');
   })());
  }
  categoryId=await categoryCache.get(categoryGroupKey(categoryName));
 }
 const row={id:p.id,store_id:store,code:p.kode||null,barcode:(String(p.barcode||'').trim()||null),name:p.nama,category_id:categoryId,price:Number(p.harga_jual_1??p.harga??0),stock:Math.max(0,Number(p.stok||0)),active:p.active!==false,image_url:(/^https?:\/\//i.test(String(p.foto||''))?p.foto:null)};
 let result=await sb.from('products').upsert(row,{onConflict:'id'});
 // Kompatibilitas sementara jika kolom image_url belum dibuat melalui migrasi Supabase.
 if(result.error&&/image_url|column/i.test(result.error.message||'')){
  const legacyRow={...row};delete legacyRow.image_url;
  result=await sb.from('products').upsert(legacyRow,{onConflict:'id'});
 }
 if(result.error)throw result.error;
}
async function syncAllProducts(){
 const categoryCache=new Map();
 for(const p of db.products)await syncOneProduct(p,categoryCache);
}

async function loadCategoryVisibility(){
 const sb=window.seamartSupabase,store=window.seamartStoreId;
 if(!sb||!store)return;
 const result=await sb.from('category_visibility').select('id,name,hidden').eq('store_id',store);
 if(result.error)throw result.error;

async function saveCategoryGroupCloud(name,hidden){

  ?await sb.from('category_visibility').update({hidden:!!hidden,updated_at:new Date().toISOString()}).eq('id',existing.id)

 if(result.error)throw result.error;
}

async function autoCategorizeProducts(){
 const candidates=db.products.filter(p=>categoryGroupKey(p.kategori||'Umum')==='umum'&&guessProductGroup(p.nama));
 if(!candidates.length)return alert('Tidak ditemukan nama barang yang cukup jelas untuk dikelompokkan otomatis.');
 if(!confirm('SeaMart menemukan '+candidates.length+' barang yang dapat dikelompokkan dari nama produknya. Barang yang tidak jelas akan tetap di Umum. Lanjutkan dan simpan ke cloud?'))return;
 const btn=[...document.querySelectorAll('button')].find(b=>b.dataset.autoGroups==='1');
 if(btn){btn.disabled=true;btn.textContent='Mengelompokkan…';}
 const cache=new Map();let done=0,failed=0;const errors=[];
 for(let i=0;i<candidates.length;i+=10){
  const batch=candidates.slice(i,i+10);
  const results=await Promise.allSettled(batch.map(async p=>{const old=p.kategori;p.kategori=guessProductGroup(p.nama);try{await syncOneProduct(p,cache);return p;}catch(e){p.kategori=old;throw e;}}));
  results.forEach(r=>{if(r.status==='fulfilled')done++;else{failed++;if(errors.length<4)errors.push(r.reason?.message||String(r.reason));}});
  save();
  if(btn)btn.textContent='Mengelompokkan '+Math.min(i+10,candidates.length)+'/'+candidates.length;
 }
 save();
 alert('Selesai. '+done+' barang berhasil dikelompokkan'+(failed?' · '+failed+' gagal disimpan.':' · tanpa kegagalan.')+(errors.length?'\nContoh: '+errors.join(' | '):''));
 categoryGroupsPage();
}

async function validateProductPhoto(url,targetName,sourceName){
  const tokens=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>=3&&!['produk','barang','pack','pcs','piece','gram','gr'].includes(x));
 const wanted=tokens(targetName),found=tokens(sourceName),shared=wanted.filter(x=>found.includes(x));
 if(!wanted.length||!shared.length)throw new Error('Nama produk tidak cocok dengan data foto. Foto ditolak.');
 const img=new Image();img.crossOrigin='anonymous';
 await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Gambar gagal dimuat. Foto ditolak.'));img.src=url});
 if(img.naturalWidth<250||img.naturalHeight<250)throw new Error('Resolusi foto terlalu kecil ('+img.naturalWidth+'×'+img.naturalHeight+'). Foto ditolak.');
 const ratio=img.naturalWidth/img.naturalHeight;
 if(ratio<0.45||ratio>2.2)throw new Error('Proporsi gambar tidak layak untuk foto produk. Foto ditolak.');
 return {width:img.naturalWidth,height:img.naturalHeight,matched:shared.join(', ')};
}
async function lookupInlineProductPhoto(){
 const barcode=(document.getElementById('if_barcode')?.value||'').trim(),name=(document.getElementById('if_nama')?.value||'').trim(),status=document.getElementById('inline_photo_status');
 window.pendingInlinePhoto=null;
 if(!barcode){if(status)status.textContent='Isi barcode barang terlebih dahulu.';return}
 if(status)status.textContent='Memeriksa kecocokan nama dan kualitas foto…';
 try{
  const response=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(barcode)+'.json?fields=code,product_name,selected_images');

  const url=typeof images==='string'?images:(images&&typeof images==='object'?(images.en||Object.values(images)[0]||''):'');
  if(data.status!==1||!url)throw new Error('Foto untuk barcode ini belum tersedia. Coba unggah dari galeri.');

 }catch(err){window.pendingInlinePhoto=null;if(status)status.textContent=err.message||'Foto tidak lolos pemeriksaan. Unggah foto yang benar dari galeri.'}

function moveDate(m){if(m.at){const d=new Date(m.at);if(!isNaN(d))return d}const t=String(m.time||'');const x=t.match(/^([0-9]{1,2})\/([0-9]{1,2})\/([0-9]{4})(?:,?\s+([0-9]{1,2})[.:]([0-9]{2})(?:[.:]([0-9]{2}))?)?/);if(x)return new Date(Number(x[3]),Number(x[2])-1,Number(x[1]),Number(x[4]||0),Number(x[5]||0),Number(x[6]||0));const d=new Date(t);return isNaN(d)?null:d}
function movementDelta(m){if(Number.isFinite(Number(m.delta)))return Number(m.delta);if(String(m.jenis||'').includes('Masuk'))return Number(m.qty||0);if(String(m.jenis||'').includes('Keluar'))return -Number(m.qty||0);return 0}
function stock(){const now=new Date(),today=now.toISOString().slice(0,10),monthStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10),oldStart=document.getElementById('stock_start')?.value,oldEnd=document.getElementById('stock_end')?.value,oldSearch=document.getElementById('stock_search')?.value||'';document.getElementById('view').innerHTML=`<div class="pagehead"><div><h1>Posisi & Mutasi Stok Barang</h1><div class="sub">Rincian stok awal, tambahan dari pemasok/cabang, barang keluar atau terjual, dan stok akhir.</div></div><div class="toolbar"><button class="btn-light" onclick="exportStockReport()">⇩ Ekspor CSV</button><button class="btn-primary" onclick="printStockReport()">Cetak PDF</button><button class="btn-light" onclick="moveModal()">＋ Catat Mutasi</button></div></div><div class="panel"><div class="toolbar"><label class="muted">Periode awal <input id="stock_start" type="date" class="field" value="${oldStart||monthStart}" onchange="stock()"></label><label class="muted">Periode akhir <input id="stock_end" type="date" class="field" value="${oldEnd||today}" onchange="stock()"></label><input id="stock_search" class="field search" placeholder="Cari nama, kode, barcode, kelompok..." value="${esc(oldSearch)}" oninput="stock()"></div><div class="emptyhint">Nilai persediaan dihitung memakai harga beli/modal; bila belum diisi, harga jual dipakai sebagai perkiraan.</div></div><div id="stock_report"></div><div class="panel"><h3>Riwayat Mutasi Terbaru</h3>${db.moves.length?'<div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Barang</th><th>Jenis</th><th>Qty</th><th>Keterangan</th></tr></thead><tbody>'+db.moves.slice().reverse().slice(0,100).map(m=>`<tr><td>${esc(m.time||'-')}</td><td>${esc(m.produk||'-')}</td><td>${esc(m.jenis||'-')}</td><td>${Number(m.qty||0)}</td><td>${esc(m.keterangan||'-')}</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">Belum ada mutasi stok.</div>'}</div>`;renderStockReport()}
function getStockRows(){const start=document.getElementById('stock_start')?.value||'1900-01-01',end=document.getElementById('stock_end')?.value||new Date().toISOString().slice(0,10),q=(document.getElementById('stock_search')?.value||'').toLowerCase(),sd=new Date(start+'T00:00:00'),ed=new Date(end+'T23:59:59.999');return db.products.filter(p=>[p.nama,p.kode,p.barcode,p.kategori].join(' ').toLowerCase().includes(q)).map(p=>{const all=db.moves.filter(m=>m.produk===p.nama),deltas=all.map(m=>({date:moveDate(m),delta:movementDelta(m)})).filter(x=>x.date),after=deltas.filter(x=>x.date>=sd).reduce((a,x)=>a+x.delta,0),period=deltas.filter(x=>x.date>=sd&&x.date<=ed),incoming=period.filter(x=>x.delta>0).reduce((a,x)=>a+x.delta,0),outgoing=-period.filter(x=>x.delta<0).reduce((a,x)=>a+x.delta,0),opening=Number(p.stok||0)-after,ending=opening+incoming-outgoing,cost=Number(p.harga_beli||0)||Number(p.harga||0);return {...p,opening,incoming,outgoing,ending,cost,openingValue:opening*cost,incomingValue:incoming*cost,outgoingValue:outgoing*cost,endingValue:ending*cost}})}
function renderStockReport(){const rows=getStockRows(),sum=k=>rows.reduce((a,p)=>a+Number(p[k]||0),0),groups={};rows.forEach(p=>(groups[p.kategori||'Umum']??=[]).push(p));const body=Object.entries(groups).map(([cat,items])=>'<tr><td colspan="12" style="background:#f4f7f5;font-weight:800;color:#3d6653">'+esc(cat)+'</td></tr>'+items.map(p=>`<tr><td>${esc(p.kode||p.barcode||'-')}</td><td><b>${esc(p.nama)}</b></td><td>${esc(p.satuan||'pcs')}</td><td class="num">${p.opening}</td><td class="num">${rupiah(p.openingValue)}</td><td class="num">${p.incoming}</td><td class="num">${rupiah(p.incomingValue)}</td><td class="num">${p.outgoing}</td><td class="num">${rupiah(p.outgoingValue)}</td><td class="num"><b style="${p.ending<0?'color:#c2410c':''}">${p.ending}</b>${p.ending<0?' <span class="pill" style="background:#fff0e8;color:#b65b20">Minus</span>':''}</td><td class="num"><b>${rupiah(p.endingValue)}</b></td><td>${rupiah(p.cost)}</td></tr>`).join('')).join('');document.getElementById('stock_report').innerHTML=`<div class="cards"><div class="stat"><div class="stat-top">Stok Awal</div><strong>${sum('opening').toLocaleString('id-ID')}</strong><small>Nilai ${rupiah(sum('openingValue'))}</small></div><div class="stat"><div class="stat-top">Barang Masuk</div><strong>${sum('incoming').toLocaleString('id-ID')}</strong><small>Nilai ${rupiah(sum('incomingValue'))}</small></div><div class="stat"><div class="stat-top">Barang Keluar</div><strong>${sum('outgoing').toLocaleString('id-ID')}</strong><small>Nilai ${rupiah(sum('outgoingValue'))}</small></div><div class="stat"><div class="stat-top">Stok Akhir</div><strong>${sum('ending').toLocaleString('id-ID')}</strong><small>Nilai persediaan ${rupiah(sum('endingValue'))}</small></div></div><div class="panel"><div class="pagehead"><div><h3 style="margin:0">Laporan Posisi dan Mutasi Stok Barang</h3><div class="sub">Periode: ${esc(document.getElementById('stock_start').value)} – ${esc(document.getElementById('stock_end').value)}</div></div><span class="pill">${rows.length} barang</span></div><div class="tablewrap"><table id="stock_table"><thead><tr><th rowspan="2">Kode</th><th rowspan="2">Nama Barang</th><th rowspan="2">Satuan</th><th colspan="2">AWAL</th><th colspan="2">MASUK</th><th colspan="2">KELUAR</th><th colspan="2">AKHIR</th><th rowspan="2">Harga Modal/Unit</th></tr><tr><th>Qty</th><th>Nilai Persediaan</th><th>Qty</th><th>Nilai Persediaan</th><th>Qty</th><th>Nilai Persediaan</th><th>Qty</th><th>Nilai Persediaan</th></tr></thead><tbody>${body||'<tr><td colspan="12" class="empty">Tidak ada barang yang cocok.</td></tr>'}</tbody><tfoot><tr style="font-weight:800;background:#f5f7f8"><td colspan="3">TOTAL</td><td>${sum('opening')}</td><td>${rupiah(sum('openingValue'))}</td><td>${sum('incoming')}</td><td>${rupiah(sum('incomingValue'))}</td><td>${sum('outgoing')}</td><td>${rupiah(sum('outgoingValue'))}</td><td>${sum('ending')}</td><td>${rupiah(sum('endingValue'))}</td><td>—</td></tr></tfoot></table></div></div>`}
function exportStockReport(){const rows=getStockRows(),head=['kode','nama','kelompok','satuan','stok_awal_qty','stok_awal_nilai','masuk_qty','masuk_nilai','keluar_qty','keluar_nilai','stok_akhir_qty','stok_akhir_nilai','harga_modal_unit'],data=rows.map(p=>[p.kode||p.barcode,p.nama,p.kategori,p.satuan||'pcs',p.opening,p.openingValue,p.incoming,p.incomingValue,p.outgoing,p.outgoingValue,p.ending,p.endingValue,p.cost]);download('seamart-posisi-mutasi-stok.csv',[head,...data].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n'))}
function printStockReport(){const rows=getStockRows(),start=document.getElementById('stock_start').value,end=document.getElementById('stock_end').value,w=window.open('','_blank','width=1200,height=800');if(!w)return alert('Izinkan pop-up untuk mencetak atau menyimpan PDF.');const cells=rows.map(p=>`<tr><td>${esc(p.kode||p.barcode||'-')}</td><td>${esc(p.nama)}</td><td>${esc(p.kategori||'Umum')}</td><td>${p.opening}</td><td>${rupiah(p.openingValue)}</td><td>${p.incoming}</td><td>${rupiah(p.incomingValue)}</td><td>${p.outgoing}</td><td>${rupiah(p.outgoingValue)}</td><td>${p.ending}</td><td>${rupiah(p.endingValue)}</td></tr>`).join('');w.document.write(`<!doctype html><html><head><title>SeaMart - Posisi & Mutasi Stok</title><style>body{font:10px Arial;padding:18px;color:#222}h2,p{text-align:center;margin:4px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #bbb;padding:5px;text-align:right}th:nth-child(1),th:nth-child(2),th:nth-child(3),td:nth-child(1),td:nth-child(2),td:nth-child(3){text-align:left}th{background:#eef3f0}@page{size:landscape;margin:10mm}.brand{padding-bottom:20px}.brand-lockup{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px}.odoo-category-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.odoo-category-heading .odoo-panel-label{margin:0}.category-toggle-btn{border:0;background:linear-gradient(135deg,#087b43,#16b85a);color:#fff;border-radius:8px;padding:7px 11px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 3px 8px #087b4333;transition:background .18s,transform .18s}.category-toggle-btn:hover{background:linear-gradient(135deg,#066536,#0c9848);transform:translateY(-1px)}.category-toggle-btn:active{transform:translateY(0)}
/* Mobile header spacing polish */

</style></head><body><h2>SEAMART — POSISI DAN MUTASI STOK BARANG</h2><p>Periode: ${start} – ${end}</p><table><thead><tr><th>Kode</th><th>Nama Barang</th><th>Kelompok</th><th>Awal Qty</th><th>Awal Nilai</th><th>Masuk Qty</th><th>Masuk Nilai</th><th>Keluar Qty</th><th>Keluar Nilai</th><th>Akhir Qty</th><th>Nilai Persediaan</th></tr></thead><tbody>${cells}</tbody></table><script>window.print()<\\/script></body></html>`);w.document.close()}
function moveModal(){let opts=db.products.map(p=>`<option value="${p.id}">${esc(p.nama)}</option>`).join('');document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Catat Mutasi Stok</h2><label>Produk<select id="m_prod" class="field" style="width:100%;margin:6px 0 12px">${opts}</select></label><label>Jenis<select id="m_type" class="field" style="width:100%;margin:6px 0 12px"><option>Masuk / Pembelian</option><option>Keluar / Mutasi Cabang</option><option>Penyesuaian Stok</option></select></label><label>Jumlah<input id="m_qty" type="number" min="1" class="field" style="width:100%;margin:6px 0 12px"></label><label>Keterangan<input id="m_note" class="field" style="width:100%;margin:6px 0"></label><div class="actions"><button class="btn-light" onclick="closeModal()">Batal</button><button class="btn-primary" onclick="saveMove()">Simpan Mutasi</button></div></div></div>`}
function saveMove(){let p=db.products.find(x=>x.id===document.getElementById('m_prod').value),type=document.getElementById('m_type').value,q=Number(document.getElementById('m_qty').value);if(!p||q<=0)return alert('Pilih produk dan jumlah yang valid.');let delta=0;if(type==='Masuk / Pembelian'){p.stok+=q;delta=q}else if(type==='Keluar / Mutasi Cabang'){if(p.stok<q)return alert('Stok tidak cukup.');p.stok-=q;delta=-q}else{let before=Number(p.stok||0);p.stok=q;delta=q-before}db.moves.push({time:dateNow(),at:new Date().toISOString(),produk:p.nama,jenis:type,qty:q,delta,keterangan:document.getElementById('m_note').value});save();closeModal();stock()}
function sales(){let total=db.sales.reduce((a,s)=>a+Number(s.total||0),0),map={};db.sales.forEach(s=>(s.items||[]).forEach(i=>{map[i.nama]=(map[i.nama]||0)+Number(i.qty||0)}));document.getElementById('view').innerHTML=`<div class="pagehead"><div><h1>Laporan Penjualan</h1><div class="sub">Rekap transaksi dan penjualan per barang.</div></div><div class="toolbar"><button class="btn-light" onclick="exportSales()">⇩ Ekspor CSV</button><button class="btn-danger" onclick="showClearSalesConfirm()">⌫ Hapus Riwayat</button></div></div><div class="notice">Gunakan tombol Ubah untuk memperbaiki total atau metode pembayaran. Hapus Riwayat akan menghapus semua transaksi dan mengembalikan stok barang yang terjual.</div><div class="cards"><div class="stat"><div class="stat-top">Total Transaksi</div><strong>${db.sales.length}</strong></div><div class="stat"><div class="stat-top">Total Penjualan</div><strong>${rupiah(total)}</strong></div><div class="stat"><div class="stat-top">Tunai</div><strong>${db.sales.filter(s=>s.pay==='Tunai').length}</strong></div><div class="stat"><div class="stat-top">QRIS</div><strong>${db.sales.filter(s=>s.pay==='QRIS').length}</strong></div></div><div class="grid2"><div class="panel"><div class="pagehead" style="margin-bottom:12px"><h3>Riwayat Transaksi</h3><button class="btn-danger" onclick="showClearSalesConfirm()">⌫ Hapus Semua</button></div>${salesTable(db.sales.slice().reverse())}</div><div class="panel"><h3>Penjualan per Barang</h3>${Object.keys(map).length?'<div class="tablewrap"><table><thead><tr><th>Barang</th><th>Terjual</th></tr></thead><tbody>'+Object.entries(map).map(([n,q])=>`<tr><td>${esc(n)}</td><td>${q}</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">Belum ada penjualan.</div>'}</div></div>`}
function exportSales(){let rows=[['transaksi','waktu','produk','qty','harga','subtotal','total','pembayaran']];db.sales.forEach(s=>s.items.forEach(i=>rows.push([s.id,s.time,i.nama,i.qty,i.harga,i.subtotal,s.total,s.pay])));download('seamart-laporan-penjualan.csv',rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'))}

 if(!Array.isArray(db.accounts)||!db.accounts.length){
  db.accounts=[

}
function settings(){document.getElementById('view').innerHTML=`<div class="pagehead"><div><h1>Pengaturan & Data</h1><div class="sub">Kelola data lokal dan siapkan migrasi ke database online.</div></div></div><div class="panel"><h3>Master Barang CSV</h3><p class="muted">Format kompatibel dengan master lama: <b>nama,barcode,harga,stok</b>. Kolom kode dan kategori juga didukung. Pencocokan barcode/kode akan memperbarui produk yang sama tanpa mengganti barcode yang sudah tersimpan.</p><button class="btn-primary" onclick="document.getElementById('csvfile').click()">Impor Master CSV</button> <button class="btn-light" onclick="exportCSV()">Ekspor Master CSV</button></div><div class="panel"><h3>Cadangan Data</h3><p class="muted">Unduh salinan data browser sebagai JSON untuk cadangan.</p><button class="btn-light" onclick="download('seamart-backup.json',JSON.stringify(db,null,2))">Unduh Backup JSON</button></div><div class="panel"><h3>Status Sistem</h3><div class="totalrow"><span>Antarmuka Odoo-inspired</span><span class="pill">Aktif</span></div><div class="totalrow"><span>Penyimpanan browser</span><span class="pill">Aktif</span></div><div class="totalrow"><span>Database cloud bersama</span><span class="pill" style="background:#fff3e8;color:#a65d1c">Belum dikonfigurasi</span></div><div class="totalrow"><span>Login aman admin/kasir</span><span class="pill" style="background:#fff3e8;color:#a65d1c">Belum dikonfigurasi</span></div></div><div class="panel"><h3>Zona Reset</h3><p class="muted">Menghapus seluruh data lokal pada browser ini.</p><button class="btn-danger" onclick="if(confirm('Hapus semua data SeaMart pada browser ini? Pastikan sudah membuat backup.')){db={products:[],moves:[],sales:[]};save();settings()}">Reset Data Lokal</button></div>`}
document.getElementById('shiftAction').style.display='none';showLogin();try{page('dashboard')}catch(err){console.error('SeaMart render error:',err);document.getElementById('view').innerHTML='<div class="panel"><h3>Dashboard belum dapat dimuat</h3><p class="muted">Data lokal sedang diperiksa. Muat ulang halaman. Jika masih muncul, ekspor cadangan data dari menu Pengaturan & Data lalu kirimkan tangkapan layar ini.</p><button class="btn-primary" onclick="location.reload()">Muat Ulang</button></div>';}
if(!document.getElementById('view').innerHTML.trim()){document.getElementById('view').innerHTML='<div class="panel"><h3>Dashboard belum tampil</h3><p class="muted">Aplikasi berhasil dibuka, tetapi isi dashboard belum dirender. Silakan kirim screenshot pesan ini.</p></div>';}
